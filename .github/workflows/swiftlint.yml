name: SwiftLint

# Lint with the repository's existing rules and the last verified SwiftLint
# release. Use a standard runner; public-repository builds remain free.

on:
  push:
    branches: [main, feature/lila-siri-ai-mode, feature/lilashift-4.0-quality-upgrade]
  pull_request:
    branches: [main, feature/lila-siri-ai-mode, feature/lilashift-4.0-quality-upgrade]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swiftlint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install verified SwiftLint 0.65.1
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/portable_swiftlint.zip"
          install_dir="$RUNNER_TEMP/swiftlint-0.65.1"
          curl --fail --location --retry 3 \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip \
            --output "$archive"
          printf 'c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  %s\n' "$archive" \
            | shasum -a 256 -c -
          mkdir -p "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          chmod +x "$install_dir/swiftlint"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/swiftlint" version

      - name: Lint
        run: swiftlint lint --reporter github-actions-logging
