name: Apply Stage 9-fix3 Patch

on:
  workflow_dispatch:
    inputs:
      patch:
        description: 'Patch file in repo root'
        required: true
        default: 'stage9-fix3.patch'
      base_sha:
        description: 'Expected base commit on the branch'
        required: true
        default: '018001a17bcbeeb575815ee2bd3c14e81ca2fb8f'
      expected_tree:
        description: 'Expected tree hash after applying'
        required: true
        default: '57fa45a105f92411af0eeb128aa118fbc2686307'
      commit_message:
        description: 'Commit message for the applied patch'
        required: true
        default: 'Stage 9 fix3'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Check base is ancestor
        run: |
          git merge-base --is-ancestor "${{ inputs.base_sha }}" HEAD || {
            echo "Base ${{ inputs.base_sha }} is not an ancestor of HEAD $(git rev-parse HEAD)"
            exit 1
          }
          echo "Base OK: ${{ inputs.base_sha }} is ancestor of $(git rev-parse HEAD)"

      - name: Apply patch
        run: |
          test -f "${{ inputs.patch }}" || { echo "Patch file missing: ${{ inputs.patch }}"; exit 1; }
          git apply --check "${{ inputs.patch }}"
          git apply "${{ inputs.patch }}"
          git status --porcelain

      - name: Verify staged files
        run: |
          git add -A
          echo "--- staged files ---"
          git diff --cached --name-only
          echo "--- shortstat ---"
          git diff --cached --shortstat
          staged="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          test "$staged" = "6" || { echo "Expected 6 staged files, got $staged"; exit 1; }
          git diff --cached --name-only | grep -qxF ".github/workflows/apply-stage9-fix3.yml" && { echo "Workflow file must not be in staged patch files"; exit 1; } || true
          grep -qxF "${{ inputs.patch }}" <(git diff --cached --name-only) && { echo "Patch file must not be in staged patch files"; exit 1; } || true
          shortstat="$(git diff --cached --shortstat)"
          test "$shortstat" = "6 files changed, 41 insertions(+), 16 deletions(-)" || { echo "Unexpected shortstat: $shortstat"; exit 1; }

      - name: Verify tree hash
        run: |
          git rm --cached -q "${{ inputs.patch }}" .github/workflows/apply-stage9-fix3.yml
          tree="$(git write-tree)"
          echo "Tree: $tree"
          test "$tree" = "${{ inputs.expected_tree }}" || { echo "Tree mismatch: expected ${{ inputs.expected_tree }}, got $tree"; exit 1; }
          git reset -q

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Nothing to commit"; exit 1; }
          git commit -m "${{ inputs.commit_message }}"
          git push origin HEAD

      - name: Cleanup scaffolding
        if: always()
        run: |
          if git ls-files --error-unmatch "${{ inputs.patch }}" >/dev/null 2>&1; then
            git rm -q "${{ inputs.patch }}"
          fi
          if git ls-files --error-unmatch .github/workflows/apply-stage9-fix3.yml >/dev/null 2>&1; then
            git rm -q .github/workflows/apply-stage9-fix3.yml
          fi
          if git show HEAD:.github/workflows/apply-stage9-fix3.yml >/dev/null 2>&1; then
            echo "Workflow file is committed on the branch; leaving it in place"
          else
            echo "Workflow file is not committed on the branch"
          fi
          if git show HEAD:"${{ inputs.patch }}" >/dev/null 2>&1; then
            echo "Patch file is committed on the branch; leaving it in place"
          else
            echo "Patch file is not committed on the branch"
          fi
          git status --porcelain
          echo "Cleanup done (scaffolding files are removed from the working tree only if present in the index; committed copies are untouched)"
