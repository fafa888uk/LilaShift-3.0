name: Apply LilaShift 5.0 Fix 5

# One-shot: apply lilashift-5.0-fix5.patch (fix5: test failures on the
# fix4 baseline) to the 5.0 branch.
# The patch file must already be uploaded to the branch root.
# Patch SHA-256: 398bbf7dedfc81974e356519cb98c72aa8c7b3b5364c23dd2af1a3c82333d4b3 (verified)
# Base: feature/lilashift-5.0 @ 16dce39
#   ("LilaShift 5.0.0 fix4: optional statistics unwrap", tree 167803de).
# Dispatch with ref = feature/lilashift-5.0.
#
# This file must exist identically on main (so it can be dispatched)
# and on feature/lilashift-5.0 (so the run checks out the branch
# with the patch file). It stays on main afterwards as scaffolding.
#
# TEMPLATE SOURCE (authoritative): the fix1 workflow as it exists
# on main @ e707691, which includes the fetch-depth: 0 fix and ran
# green. Only the parameters below were changed for fix5.
#
# PLACEHOLDERS -- all filled in after fix5 landed (2026-11-28):
#   SHA-256 398bbf7dedfc81974e356519cb98c72aa8c7b3b5364c23dd2af1a3c82333d4b3
#   12 files, +45/-11, expected tree 1208c0031eecab87d088c2126b62f454a95805ca
#   (local fix5 commit 50c91e0, verified by clean-checkout apply test)
#   Commit message "LilaShift 5.0.0 fix5: test failures" confirmed by the coordinator.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/lilashift-5.0
          fetch-depth: 0

      - name: Verify baseline is an ancestor
        run: |
          git merge-base --is-ancestor 16dce39c07ee38c7d25c0f6efe04bb70c7cdd481 HEAD
          echo "base 16dce39 is an ancestor of HEAD"

      - name: Verify patch file
        run: |
          ls -l lilashift-5.0-fix5.patch
          echo "398bbf7dedfc81974e356519cb98c72aa8c7b3b5364c23dd2af1a3c82333d4b3  lilashift-5.0-fix5.patch" | sha256sum -c -

      - name: Apply patch
        run: |
          git config user.name "fafa888uk"
          git config user.email "fafa888uk@users.noreply.github.com"
          git apply --index lilashift-5.0-fix5.patch

      - name: Verify staged files
        run: |
          echo "=== staged files ==="
          git diff --cached --name-only
          echo "=== staged stat ==="
          git diff --cached --stat
          # Expect exactly 12 files, +45/-11 (the 6 deleted PNGs are
          # binary: numstat shows "-/-" for them, so awk counts 0)
          test "$(git diff --cached --name-only | wc -l)" -eq 12
          git diff --cached --name-only | grep -qxF "GestaltX/IPAAuditScanner.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/W6FileBrowser.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/W6FileBrowserViews.swift"
          git diff --cached --name-only | grep -qxF "tests/IPAAuditTests.swift"
          git diff --cached --name-only | grep -qxF "tests/W4AppleWikiKeyTableTests.swift"
          git diff --cached --name-only | grep -qxF "tests/W5NetworkProbeTests.swift"
          git diff --cached --name-only | grep -qxF "tests/__Snapshots__/DashboardV3SnapshotTests/testV3HomePopulatedAccessibilitySnapshot.v3-home-populated-accessibility.png"
          git diff --cached --name-only | grep -qxF "tests/__Snapshots__/DashboardV3SnapshotTests/testV3HomePopulatedNarrowSnapshot.v3-home-populated-narrow-320.png"
          git diff --cached --name-only | grep -qxF "tests/__Snapshots__/DashboardV3SnapshotTests/testV3HomePopulatedSnapshot.v3-home-populated.png"
          git diff --cached --name-only | grep -qxF "tests/__Snapshots__/DashboardV3SnapshotTests/testV3HomeUnreadSnapshot.v3-home-unread.png"
          git diff --cached --name-only | grep -qxF "tests/__Snapshots__/ViewSnapshotTests/testPersonalizationCenterCardPopulatedSnapshot.personalization-center-populated.png"
          git diff --cached --name-only | grep -qxF "tests/__Snapshots__/ViewSnapshotTests/testPersonalizationCenterCardUnreadSnapshot.personalization-center-unread.png"
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print s}')" -eq 45
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print d}')" -eq 11
          # The branch also tracks the uploaded patch file and this
          # workflow file, so the staged tree includes them and can
          # never equal the expected tree. Remove them from the index
          # (disk copies stay) before comparing the tree.
          git rm --cached -q lilashift-5.0-fix5.patch .github/workflows/apply-lilashift-5.0-fix5.yml
          # Expect tree 1208c0031eecab87d088c2126b62f454a95805ca
          # (base 16dce39 + patch)
          test "$(git write-tree)" = "1208c0031eecab87d088c2126b62f454a95805ca"

      - name: Commit and push
        run: |
          git commit -m "LilaShift 5.0.0 fix5: test failures"
          git push origin feature/lilashift-5.0

      - name: Clean up patch file
        if: always()
        # The patch file was already removed from the index by the
        # verify step, so it is not in the fix commit; it is only an
        # untracked file on disk in this ephemeral runner. Delete it
        # from disk; there is nothing to commit.
        run: |
          rm -f lilashift-5.0-fix5.patch
          git status --porcelain
