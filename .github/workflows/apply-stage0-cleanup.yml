name: Apply Stage 0 cleanup

# One-shot: apply stage0-cleanup.patch (Stage 0 P0 fixes: license sync,
# CI triggers are NOT in this patch, test target, README honesty) to the
# LilaShift 4.0 branch. The patch file must already be uploaded to the
# branch root, and this workflow file must exist on BOTH main (so it can
# be dispatched) and the target branch (so the write-tree check below can
# remove it from the index; the fix commit deletes it from the branch).
# Dispatch with ref = main.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/lilashift-4.0-quality-upgrade

      - name: Verify patch file
        run: |
          ls -l stage0-cleanup.patch
          test "$(sha256sum stage0-cleanup.patch | cut -d' ' -f1)" = "50e58726e12ebcf4e1ca84e20180261e9491efddc91f35494775da0a434284a4"

      - name: Apply patch
        run: |
          git config user.name "fafa888uk"
          git config user.email "fafa888uk@users.noreply.github.com"
          git apply --index stage0-cleanup.patch

      - name: Verify staged files
        run: |
          echo "=== staged files ==="
          git diff --cached --name-only
          echo "=== staged stat ==="
          git diff --cached --stat
          # Expect exactly 15 files, +141/-41
          test "$(git diff --cached --name-only | wc -l)" -eq 15
          git diff --cached --name-only | grep -qxF "GestaltX.xcodeproj/project.pbxproj"
          git diff --cached --name-only | grep -qxF "GestaltX.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          git diff --cached --name-only | grep -qxF "GestaltX/AboutView.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/Licenses/ThirdPartyNotices.txt"
          git diff --cached --name-only | grep -qxF "GestaltX/LiquidGlass.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/WelcomeView.swift"
          git diff --cached --name-only | grep -qxF "README.md"
          git diff --cached --name-only | grep -qxF "README_ZH-CN.md"
          git diff --cached --name-only | grep -qxF "THIRD_PARTY_NOTICES.md"
          git diff --cached --name-only | grep -qxF "docs/FEATURE_ORIGIN_MATRIX.md"
          git diff --cached --name-only | grep -qxF "docs/INSTALL_ZH-CN.md"
          git diff --cached --name-only | grep -qxF "docs/OPEN_SOURCE_REFERENCES.md"
          git diff --cached --name-only | grep -qxF "docs/USER_GUIDE_ZH-CN.md"
          git diff --cached --name-only | grep -qxF "scripts/check-licenses.py"
          git diff --cached --name-only | grep -qxF "tests/ThirdPartyNoticesTests.py"
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print s}')" -eq 141
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print d}')" -eq 41
          # The branch also tracks the uploaded patch file and this
          # workflow file, so the staged tree includes them and can
          # never equal the expected tree. Remove them from the index
          # (disk copies stay) before comparing the tree.
          git rm --cached -q stage0-cleanup.patch .github/workflows/apply-stage0-cleanup.yml
          # Expect tree 0ac942400123d95b175c2f654058a7d9308cb1a8
          test "$(git write-tree)" = "0ac942400123d95b175c2f654058a7d9308cb1a8"

      - name: Commit and push
        run: |
          git commit -m "Stage 0 cleanup: fix license sync, test target, README honesty

          P0 fixes from the Stage 0 audit:
          - License sync: reconcile THIRD_PARTY_NOTICES.md with the
            in-app notices (Erosion-CN section 5 drift), register
            kolbicz/WQFiles (research reference, GPL-3.0, no code
            copied), record SnapshotTesting 1.19.7 pin. The license
            checker now passes with 0 failures and 0 warnings.
          - Test target: add DashboardV3Tests.swift to the XCTest
            target so all 505 tests run (was 501).
          - README honesty: remove the unverified 'Verified on
            iPhone Air' claim for this HEAD, correct stale 55-item /
            42-preset counts to 58-item / 45-preset, correct the
            FEATURE_ORIGIN_MATRIX cache-rebuild entry, fix the
            LiquidGlass copyright header (LilaShift original).
          Workflow trigger changes ride separately via the web editor
          (workflow files can never be pushed by an apply workflow)."
          git push origin feature/lilashift-4.0-quality-upgrade

      - name: Clean up patch file
        # The patch file was already removed from the index by the
        # verify step, so it is not in the fix commit; it is only an
        # untracked file on disk in this ephemeral runner. Delete it
        # from disk; there is nothing to commit. The workflow file
        # is likewise already absent from the branch after the fix
        # commit; verify it is gone rather than deleting it.
        run: |
          rm -f stage0-cleanup.patch
          test ! -e .github/workflows/apply-stage0-cleanup.yml
          git status --porcelain
