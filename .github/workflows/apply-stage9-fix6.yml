name: Apply Stage 9-fix6 Patch


on:
  workflow_dispatch:
    inputs:
      patch:
        description: 'Patch file in repo root'
        required: true
        default: 'stage9-fix6.patch'
      base_sha:
        description: 'Expected base commit (Stage 9 fix5)'
        required: true
        default: '21eb7e1e34ccbe7a1d040f061b516d06a49c7b10'
      expected_tree:
        description: 'Expected tree hash after applying patch'
        required: true
        default: '448be53ad0fff29de24e001f988bc55e47ba6420'
      commit_message:
        description: 'Commit message for the applied patch'
        required: true
        default: 'Stage 9 fix6'


permissions:
  contents: write


jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0


      - name: Verify base commit
        run: |
          git merge-base --is-ancestor "${{ inputs.base_sha }}" HEAD || { echo "Base ${{ inputs.base_sha }} is not an ancestor of HEAD $(git rev-parse HEAD)"; exit 1; }
          echo "Base verified: ${{ inputs.base_sha }} is ancestor of HEAD"


      - name: Verify patch file exists
        run: |
          test -f "${{ inputs.patch }}" || { echo "Patch file ${{ inputs.patch }} not found"; exit 1; }
          sha256sum "${{ inputs.patch }}"


      - name: Apply patch
        run: |
          git apply --check "${{ inputs.patch }}" || { echo "Patch does not apply cleanly"; exit 1; }
          git apply "${{ inputs.patch }}"


      - name: Verify staged files
        run: |
          git add -A
          echo "=== Staged files ==="
          git diff --cached --name-only
          echo "=== Staged count ==="
          git diff --cached --name-only | wc -l
          test "$(git diff --cached --name-only | wc -l)" -eq 1 || { echo "Expected exactly 1 staged file"; exit 1; }
          git diff --cached --name-only | grep -qxF ".github/workflows/apply-stage9-fix6.yml" && { echo "Workflow file must not be in staged patch files"; exit 1; } || true
          grep -qxF "${{ inputs.patch }}" <(git diff --cached --name-only) && { echo "Patch file must not be in staged patch files"; exit 1; } || true
          echo "=== Staged shortstat ==="
          git diff --cached --shortstat
          STAT="$(git diff --cached --shortstat | sed 's/^ *//')"
          test "$STAT" = "1 file changed, 1 insertion(+), 1 deletion(-)" || { echo "Unexpected shortstat: [$STAT]"; exit 1; }


      - name: Verify tree hash
        run: |
          git rm --cached -q "${{ inputs.patch }}" .github/workflows/apply-stage9-fix6.yml
          if git ls-files --error-unmatch "${{ inputs.patch }}" >/dev/null 2>&1; then echo "Patch file still in index after rm --cached"; exit 1; fi
          if git ls-files --error-unmatch .github/workflows/apply-stage9-fix6.yml >/dev/null 2>&1; then echo "Workflow file still in index after rm --cached"; exit 1; fi
          TREE="$(git write-tree)"
          echo "Computed tree: $TREE"
          echo "Expected tree: ${{ inputs.expected_tree }}"
          test "$TREE" = "${{ inputs.expected_tree }}" || { echo "Tree hash mismatch"; exit 1; }


      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && { echo "Nothing to commit"; exit 1; }
          git commit -m "Stage 9 fix6"
          git push origin HEAD


      - name: Cleanup scaffolding
        if: always()
        run: |
          rm -f stage9-fix6.patch .github/workflows/apply-stage9-fix6.yml
          echo "--- files in index ---"
          git ls-files
          echo "--- status ---"
          git status --porcelain
