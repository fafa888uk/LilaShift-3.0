name: LilaShift 5.0.0 official build
on:
  push:
    branches: [codex/lilashift-5.0-official]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lilashift-v5-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/codex/lilashift-5.0-official' && github.event.repository.visibility == 'public'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check and test
        run: |
          set -euo pipefail
          bash -n scripts/package.sh
          plutil -lint LilaShift.xcodeproj/project.pbxproj App/*.lproj/Localizable.strings
          swift test
      - name: Build and verify self-signable IPA
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LilaShift-5.0.0-unsigned
          path: |
            artifacts/LilaShift_5.0.0.ipa
            artifacts/LilaShift_5.0.0.ipa.sha256
          if-no-files-found: error
