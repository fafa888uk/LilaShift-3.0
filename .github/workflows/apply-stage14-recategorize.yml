name: Apply Stage 14 Patch

on:
  workflow_dispatch:
    inputs:
      patch_file:
        description: 'Patch file to apply (must exist on the branch)'
        required: true
        default: 'stage14-recategorize.patch'
      base_sha:
        description: 'Expected base commit (Stage 13 fix2 commit)'
        required: true
        default: '4dbc674ef1cc0fe96b31409c02f2876aad556e2c'
      expected_tree:
        description: 'Expected tree hash after applying the patch'
        required: true
        default: '80aac1559421d2ccff726fa99f879a217aaae42a'
      commit_message:
        description: 'Commit message for the applied patch'
        required: true
        default: 'Stage 14: navigation recategorization, version 4.2.0'

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/lilashift-4.0-quality-upgrade
          fetch-depth: 0

      - name: Verify base commit is an ancestor
        run: |
          git merge-base --is-ancestor "${{ inputs.base_sha }}" HEAD
          echo "Base commit ${{ inputs.base_sha }} is an ancestor of HEAD $(git rev-parse HEAD)"

      - name: Apply patch and verify staged change
        run: |
          test -f "${{ inputs.patch_file }}"
          git apply --index "${{ inputs.patch_file }}"

          ACTUAL_COUNT="$(git diff --cached --name-only | wc -l)"
          if [ "$ACTUAL_COUNT" -ne 20 ]; then
            echo "Expected exactly 20 staged files, got: $ACTUAL_COUNT"
            git diff --cached --name-only
            exit 1
          fi

          ACTUAL_SHORTSTAT="$(git diff --cached --shortstat | sed 's/^ *//')"
          if [ "$ACTUAL_SHORTSTAT" != "20 files changed, 430 insertions(+), 85 deletions(-)" ]; then
            echo "Expected shortstat: 20 files changed, 430 insertions(+), 85 deletions(-)"
            echo "Actual shortstat: $ACTUAL_SHORTSTAT"
            exit 1
          fi

          echo "Staged change verified: $ACTUAL_SHORTSTAT"

      - name: Verify tree hash
        run: |
          git rm --cached -q "${{ inputs.patch_file }}"
          git rm --cached -q .github/workflows/apply-stage14-recategorize.yml

          ACTUAL_TREE="$(git write-tree)"
          if [ "$ACTUAL_TREE" != "${{ inputs.expected_tree }}" ]; then
            echo "Expected tree: ${{ inputs.expected_tree }}"
            echo "Actual tree: $ACTUAL_TREE"
            exit 1
          fi

          echo "Tree hash verified: $ACTUAL_TREE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "${{ inputs.commit_message }}"
          git push
          echo "Pushed commit $(git rev-parse HEAD)"

      - name: Cleanup scaffolding
        if: always()
        run: |
          rm -f "${{ inputs.patch_file }}" .github/workflows/apply-stage14-recategorize.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove stage14 scaffolding patch and workflow"
            git push
            echo "Cleanup committed and pushed"
          else
            echo "Nothing to clean up"
          fi
