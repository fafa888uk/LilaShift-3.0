name: Apply wallpaper save to Photos

# One-shot: apply lilashift-wallpaper-save.patch (Save wallpaper
# to Photos fallback) to the wallpaper-save branch. The patch file
# must already be uploaded to the branch root.
# Dispatch with ref = feature/lila-wallpaper-save.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/lila-wallpaper-save

      - name: Verify patch file
        run: |
          ls -l lilashift-wallpaper-save.patch
          sha256sum lilashift-wallpaper-save.patch
          test "$(sha256sum lilashift-wallpaper-save.patch | cut -d' ' -f1)" = "559cffe44b36caba015c5b7340a959b129cec09de540e152a9325beadf2616b7"

      - name: Apply patch
        run: |
          git config user.name "fafa920q-hue"
          git config user.email "fafa920q-hue@users.noreply.github.com"
          git apply --index lilashift-wallpaper-save.patch

      - name: Verify staged files
        run: |
          echo "=== staged files ==="
          git diff --cached --name-only
          echo "=== staged stat ==="
          git diff --cached --stat
          # Expect exactly 15 files, +294/-0
          test "$(git diff --cached --name-only | wc -l)" -eq 15
          git diff --cached --name-only | grep -qxF "GestaltX/CustomizationStore.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/CustomizationThemes.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/CustomizationViews.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/Localizable.xcstrings"
          git diff --cached --name-only | grep -qxF "scripts/generate_localization.py"
          git diff --cached --name-only | grep -qxF "tests/WallpaperSaveToPhotosTests.swift"
          git diff --cached --name-only | grep -qxF "GestaltX.xcodeproj/project.pbxproj"
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print s}')" -eq 294
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print d}')" -eq 0
          # The branch also tracks the uploaded patch file and this
          # workflow file, so the staged tree includes them and can
          # never equal the expected tree. Remove them from the index
          # (disk copies stay) before comparing the tree.
          git rm --cached -q lilashift-wallpaper-save.patch .github/workflows/apply-wallpaper-save.yml
          # Expect tree 60bb0c6adb560fc328ed013b91c231d6e859d4cd
          test "$(git write-tree)" = "60bb0c6adb560fc328ed013b91c231d6e859d4cd"

      - name: Commit and push
        run: |
          git commit -m "feat: add Save to Photos for wallpaper packs

          Adds a Save to Photos button per wallpaper pack. The pack
          image (largest real PNG/JPEG/HEIC file in its descriptors,
          by magic bytes) is saved to Photos via the public Photos
          API (addOnly). The copy states only that the wallpaper was
          saved to Photos and the user sets it from Photos (Use as
          Wallpaper) or with the Shortcuts Set Wallpaper action; it
          never claims the wallpaper was set. Includes
          WallpaperSaveToPhotosTests (3 tests) and localization for
          all 10 locales. The PosterBoard escape path is untouched."
          git push origin feature/lila-wallpaper-save

      - name: Clean up patch file
        # The patch file was already removed from the index by the
        # verify step, so it is not in the fix commit; it is only an
        # untracked file on disk in this ephemeral runner. Delete it
        # from disk; there is nothing to commit.
        run: |
          rm -f lilashift-wallpaper-save.patch
          git status --porcelain
