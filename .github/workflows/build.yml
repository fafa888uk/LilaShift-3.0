name: Build LilaShift IPA

# Builds an ad-hoc signed IPA for every push to main, pull request, version
# tag, release, and manual dispatch. The IPA keeps the App Group entitlements
# of the app and its share extension, so AltStore and SideStore can register
# the group when they re-sign it.
#
# Every run uploads the IPA as a workflow artifact. Tag and release runs also
# attach it to the matching GitHub release, replacing an asset with the same
# name.

on:
  release:
    types: [published]
  push:
    branches: [main, feature/lilashift-3.0-dashboard]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        type: string
        default: main

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      REF: ${{ github.event.release.tag_name || inputs.ref || (github.head_ref == 'feature/lilashift-3.1-iphone18-2-persistence' && github.event.pull_request.head.sha) || github.ref }}
      TAG: ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Use the current build script for old tags
        # Tags made before this workflow existed have no build script.
        if: env.TAG != ''
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --depth=1 origin "$DEFAULT_BRANCH"
          git checkout FETCH_HEAD -- .github/scripts/build-ipa.sh

      - name: Build LilaShift IPA
        id: build
        run: |
          export BUILD_DATE="$(date -u +%F)"
          .github/scripts/build-ipa.sh "$RUNNER_TEMP/ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: LilaShift-${{ steps.build.outputs.version }}
          path: ${{ steps.build.outputs.ipa }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish release assets
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          IPA: ${{ steps.build.outputs.ipa }}
        run: |
          version="${TAG#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          : > "$notes"
          printf 'English | [简体中文](https://github.com/fafa920q-hue/LilaShift-2.0/blob/%s/CHANGELOG_ZH-CN.md)\n\n' "$TAG" > "$notes"
          if [[ -f CHANGELOG.md ]]; then
            awk -v ver="$version" '
              $0 ~ "^## \\[" ver "\\]" { found = 1; next }
              found && /^## \[/ { exit }
              found { if (!started && $0 == "") next; started = 1; print }
            ' CHANGELOG.md >> "$notes"
          fi
          if ! grep -q '^### ' "$notes"; then
            printf 'LilaShift %s\n' "$TAG" >> "$notes"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag \
              --title "LilaShift $TAG" --notes-file "$notes"
          fi
          assets=("$IPA")
          [[ -f CHANGELOG.md ]] && assets+=("CHANGELOG.md")
          [[ -f CHANGELOG_ZH-CN.md ]] && assets+=("CHANGELOG_ZH-CN.md")
          gh release upload "$TAG" "${assets[@]}" --clobber

      - name: Publish job summary
        # Writes a short summary (SHA, version, artifact) to the run
        # page. Never fails the job: every lookup is guarded and falls
        # back to "unknown" / "not parsed".
        if: always()
        env:
          IPA: ${{ steps.build.outputs.ipa }}
          VERSION: ${{ steps.build.outputs.version }}
          SOURCE_COMMIT: ${{ steps.build.outputs.source_commit }}
          IPA_SHA256: ${{ steps.build.outputs.ipa_sha256 }}
        run: |
          version="${VERSION:-}"
          if [ -z "$version" ]; then
            version="$(sed -n 's/^[[:space:]]*MARKETING_VERSION = \(.*\);/\1/p' GestaltX.xcodeproj/project.pbxproj | sort -u || true)"
          fi
          build="$(sed -n 's/^[[:space:]]*CURRENT_PROJECT_VERSION = \(.*\);/\1/p' GestaltX.xcodeproj/project.pbxproj | sort -u || true)"
          [ -n "$version" ] || version="unknown"
          [ -n "$build" ] || build="unknown"
          ipa_file="LilaShift_${version}.ipa"
          size="not parsed"
          if [ -n "${IPA:-}" ] && [ -f "$IPA" ]; then
            size="$(stat -f%z "$IPA" 2>/dev/null || true)"
            [ -n "$size" ] || size="not parsed"
          fi
          {
            echo "## Build LilaShift IPA"
            echo ""
            echo "- Commit: $(git rev-parse HEAD 2>/dev/null || echo unknown)"
            echo "- IPA source commit: ${SOURCE_COMMIT:-unavailable}"
            echo "- IPA SHA-256: ${IPA_SHA256:-unavailable}"
            echo "- Ref: ${{ github.ref }}"
            echo "- Version: $version ($build)"
            echo "- Artifact: LilaShift-$version"
            echo "- IPA file: $ipa_file ($size bytes)"
            echo "- Conclusion: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY" || true
