name: Apply LilaShift 5.0 Fix 1

# One-shot: apply lilashift-5.0-fix1.patch (fix1: CI errors on the
# Wave 1 baseline) to the 5.0 branch.
# The patch file must already be uploaded to the branch root.
# Patch SHA-256: b3cf91622f74b02ffbd40d322e28a8c256fa07f62e813d837cde84adedb1d352 (verified)
# Base: feature/lilashift-5.0 @ f8dfc98
#   ("LilaShift 5.0.0 Wave 1: diagnostics, audit, key table, probe,
#   file browser", tree e8961af4).
# Dispatch with ref = feature/lilashift-5.0.
#
# This file must exist identically on main (so it can be dispatched)
# and on feature/lilashift-5.0 (so the run checks out the branch
# with the patch file). It stays on main afterwards as scaffolding.
#
# TEMPLATE SOURCE (authoritative): the Wave 1 workflow as it exists
# on main @ b2230288 (byte-identical to the branch's 8e73b3b blob),
# which includes the fetch-depth: 0 fix. Do NOT copy from
# patches/apply-lilashift-5.0-wave1.yml -- that local copy is STALE
# (it predates the fetch-depth fix by exactly one line).
#
# PLACEHOLDERS -- all filled in after fix1 landed (2026-11-28):
#   SHA-256 b3cf91622f74b02ffbd40d322e28a8c256fa07f62e813d837cde84adedb1d352
#   7 files, +97/-44, expected tree b827dc68d32c655e2de89bad05165e97ee615db8
#   (local fix1 commit 4a01a85, verified by clean-checkout apply test)
#   Commit message "LilaShift 5.0.0 fix1: CI errors" confirmed by the coordinator.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/lilashift-5.0
          fetch-depth: 0

      - name: Verify baseline is an ancestor
        run: |
          git merge-base --is-ancestor f8dfc983af0709efb1b75520489d0f8b90d49135 HEAD
          echo "base f8dfc98 is an ancestor of HEAD"

      - name: Verify patch file
        run: |
          ls -l lilashift-5.0-fix1.patch
          echo "b3cf91622f74b02ffbd40d322e28a8c256fa07f62e813d837cde84adedb1d352  lilashift-5.0-fix1.patch" | sha256sum -c -

      - name: Apply patch
        run: |
          git config user.name "fafa888uk"
          git config user.email "fafa888uk@users.noreply.github.com"
          git apply --index lilashift-5.0-fix1.patch

      - name: Verify staged files
        run: |
          echo "=== staged files ==="
          git diff --cached --name-only
          echo "=== staged stat ==="
          git diff --cached --stat
          # Expect exactly 7 files, +97/-44
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git diff --cached --name-only | grep -qxF "GestaltX/DeviceDiagnostics.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/IPAAuditCSBlob.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/IPAAuditScanner.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/MGKeysTable.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/W5NetworkProbeViews.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/W6FileBrowserViews.swift"
          git diff --cached --name-only | grep -qxF "tests/IPAAuditTests.swift"
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print s}')" -eq 97
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print d}')" -eq 44
          # The branch also tracks the uploaded patch file and this
          # workflow file, so the staged tree includes them and can
          # never equal the expected tree. Remove them from the index
          # (disk copies stay) before comparing the tree.
          git rm --cached -q lilashift-5.0-fix1.patch .github/workflows/apply-lilashift-5.0-fix1.yml
          # Expect tree b827dc68d32c655e2de89bad05165e97ee615db8
          # (base f8dfc98 + patch)
          test "$(git write-tree)" = "b827dc68d32c655e2de89bad05165e97ee615db8"

      - name: Commit and push
        run: |
          git commit -m "LilaShift 5.0.0 fix1: CI errors"
          git push origin feature/lilashift-5.0

      - name: Clean up patch file
        if: always()
        # The patch file was already removed from the index by the
        # verify step, so it is not in the fix commit; it is only an
        # untracked file on disk in this ephemeral runner. Delete it
        # from disk; there is nothing to commit.
        run: |
          rm -f lilashift-5.0-fix1.patch
          git status --porcelain
