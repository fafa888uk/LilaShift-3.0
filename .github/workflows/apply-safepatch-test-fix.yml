name: Apply SafePatch test fix

# One-shot: apply lilashift-safepatch-test-fix.patch (the
# fail-closed one-tap test asserted featureIDs.count == 9, but the
# fail-closed one-tap stages 9 FIELDS through 8 feature IDs — eSIM
# is a single feature ID covering both keys — so the expectation
# was wrong and the test failed). The patch file must already be
# uploaded to the branch root.
# Dispatch with ref = feature/lila-tests-fix.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/lila-tests-fix

      - name: Verify patch file
        run: |
          ls -l lilashift-safepatch-test-fix.patch
          sha256sum lilashift-safepatch-test-fix.patch
          test "$(sha256sum lilashift-safepatch-test-fix.patch | cut -d' ' -f1)" = "975e6b0b526e7271450c2d3d103c58231fcd36726dc76e7295f9f77c5c3e984d"

      - name: Apply patch
        run: |
          git config user.name "fafa920q-hue"
          git config user.email "fafa920q-hue@users.noreply.github.com"
          git apply --index --binary lilashift-safepatch-test-fix.patch

      - name: Verify staged files
        run: |
          echo "=== staged files ==="
          git diff --cached --name-only
          echo "=== staged stat ==="
          git diff --cached --stat
          # Expect exactly 1 file, +5/-2
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git diff --cached --name-only | grep -qxF "tests/SafePatchTests.swift"
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print s}')" -eq 5
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print d}')" -eq 2
          # The branch also tracks the uploaded patch file and this
          # workflow file, so the staged tree includes them and can
          # never equal the expected tree. Remove them from the index
          # (disk copies stay) before comparing the tree.
          git rm --cached -q lilashift-safepatch-test-fix.patch .github/workflows/apply-safepatch-test-fix.yml
          # Expect tree f3f112fad16f416e46fe76b8ee92e636d64566cc
          test "$(git write-tree)" = "f3f112fad16f416e46fe76b8ee92e636d64566cc"

      - name: Commit and push
        run: |
          git commit -m "fix: fail-closed one-tap carries 8 feature IDs, not 9 (test expectation was wrong)

          The fail-closed one-tap stages 9 FIELDS (2 eSIM keys +
          region + 6 AI keys), but eSIM is a single feature ID
          covering both keys, so featureIDs has 8 entries. The test
          asserted 9, which is the field count, not the feature-ID
          count. Correct the expectation and document the
          distinction; the implementation is unchanged."
          git push origin feature/lila-tests-fix

      - name: Clean up patch file
        # The patch file was already removed from the index by the
        # verify step, so it is not in the fix commit; it is only an
        # untracked file on disk in this ephemeral runner. Delete it
        # from disk; there is nothing to commit.
        run: |
          rm -f lilashift-safepatch-test-fix.patch
          git status --porcelain
