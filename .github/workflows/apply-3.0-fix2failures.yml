# Apply the 3.0 snapshot fix patch, code files only (one-shot)
#
# Manually dispatched once, on feature/lilashift-3.0-dashboard:
# freezes the fingerprint capture time in the Restore snapshot test
# (the "Recorded" line rendered the live clock, so the reference
# differed on every run — Tests #196). The workflow-file part of
# the fix (failure-render collection in run-swift-tests.yml) is
# applied separately through the GitHub web editor, because a
# GITHUB_TOKEN workflow cannot push any commit that touches a file
# under .github/workflows/ — the push is rejected remotely
# ("refusing to allow a GitHub App to create or update workflow
# ... without `workflows` permission"), and `workflows: write` is
# not a legal permissions value (GitHub rejects the workflow at
# startup). Do NOT re-run after the patch is applied: git apply
# --check fails when the changes are already in the tree, and the
# run stops before committing.
#
# This patch touches only 3 code/test files, so `contents: write`
# is sufficient.
# NOTE: use `git apply --index` (not plain `git apply`) — plain
# apply only changes the worktree, leaving `git diff --cached`
# empty and the later `git commit` with nothing staged.
# NOTE 2: verification must not use grep "M\t..." — GNU grep does
# not interpret \t as a tab. Compare plain paths via --name-only
# instead; --name-status output uses real tabs, so check the status
# letters through cut -f1.
name: Apply 3.0 snapshot fix patch
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Verify patch file and apply it
        run: |
          test "$(wc -c < lilashift-3.0-fix2failures-codeonly.patch | tr -d ' ')" = "5896"
          test "$(sha256sum lilashift-3.0-fix2failures-codeonly.patch | cut -d' ' -f1)" = "3e72ebf711531614a69713b7926dc10d4886d93517159d897e29f6c582e1b427"
          git apply --check lilashift-3.0-fix2failures-codeonly.patch
          git apply --index lilashift-3.0-fix2failures-codeonly.patch

      - name: Verify the diff is exactly the 3 fix files
        run: |
          git diff --cached --name-only > /tmp/changed.txt
          cat /tmp/changed.txt
          test "$(wc -l < /tmp/changed.txt | tr -d ' ')" = "3"
          grep -qxF "GestaltX/DeviceFingerprint.swift" /tmp/changed.txt
          grep -qxF "GestaltX/DeviceFingerprintViews.swift" /tmp/changed.txt
          grep -qxF "tests/DashboardV3SnapshotTests.swift" /tmp/changed.txt
          test "$(git diff --cached --name-status | cut -f1 | sort -u)" = "M"
          test "$(git diff --cached --shortstat | grep -o '[0-9]* insertions' | grep -o '[0-9]*')" = "48"
          test "$(git diff --cached --shortstat | grep -o '[0-9]* deletions' | grep -o '[0-9]*')" = "6"

      - name: Commit the fix
        run: |
          git config user.name "fafa920q-hue"
          git config user.email "fafa920q-hue@users.noreply.github.com"
          git commit -m "fix(tests): freeze fingerprint recordedAt in Restore snapshot"
          git push
