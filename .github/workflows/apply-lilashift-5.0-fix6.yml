name: Apply LilaShift 5.0 Fix 6

# One-shot: apply lilashift-5.0-fix6.patch (fix6: flaky waitForIdle
# deadline on the fix5 baseline) to the 5.0 branch.
# The patch file must already be uploaded to the branch root.
# Patch SHA-256: 5c46430ec51810d13a94d28420efa62bfd2ece1ae2a8e2f5f0989f47c84ada95 (verified)
# Base: feature/lilashift-5.0 @ 39e930a
#   ("LilaShift 5.0.0: re-recorded snapshot references", tree 46f05b0b).
# Dispatch with ref = feature/lilashift-5.0.
#
# This file must exist identically on main (so it can be dispatched)
# and on feature/lilashift-5.0 (so the run checks out the branch
# with the patch file). It stays on main afterwards as scaffolding.
#
# TEMPLATE SOURCE (authoritative): the fix1 workflow as it exists
# on main @ e707691, which includes the fetch-depth: 0 fix and ran
# green. Only the parameters below were changed for fix6.
#
# PLACEHOLDERS -- all filled in after fix6 landed (2026-11-28):
#   SHA-256 5c46430ec51810d13a94d28420efa62bfd2ece1ae2a8e2f5f0989f47c84ada95
#   2 files, +29/-11, expected tree 93f8793cb76fac1627e08ac746223d4fa3b35f57
#   (local fix6 commit b47b4d4, verified by clean-checkout apply test)
#   Commit message "LilaShift 5.0.0 fix6: flaky waitForIdle deadline" confirmed by the coordinator.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/lilashift-5.0
          fetch-depth: 0

      - name: Verify baseline is an ancestor
        run: |
          git merge-base --is-ancestor 39e930afbcaeee65b26ae8f9701835cabc16f0a1 HEAD
          echo "base 39e930a is an ancestor of HEAD"

      - name: Verify patch file
        run: |
          ls -l lilashift-5.0-fix6.patch
          echo "5c46430ec51810d13a94d28420efa62bfd2ece1ae2a8e2f5f0989f47c84ada95  lilashift-5.0-fix6.patch" | sha256sum -c -

      - name: Apply patch
        run: |
          git config user.name "fafa888uk"
          git config user.email "fafa888uk@users.noreply.github.com"
          git apply --index lilashift-5.0-fix6.patch

      - name: Verify staged files
        run: |
          echo "=== staged files ==="
          git diff --cached --name-only
          echo "=== staged stat ==="
          git diff --cached --stat
          # Expect exactly 2 files, +29/-11
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --name-only | grep -qxF "tests/HomeDiagnosticsCacheConcurrencyTests.swift"
          git diff --cached --name-only | grep -qxF "tests/HomeDiagnosticsCacheTests.swift"
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print s}')" -eq 29
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print d}')" -eq 11
          # The branch also tracks the uploaded patch file and this
          # workflow file, so the staged tree includes them and can
          # never equal the expected tree. Remove them from the index
          # (disk copies stay) before comparing the tree.
          git rm --cached -q lilashift-5.0-fix6.patch .github/workflows/apply-lilashift-5.0-fix6.yml
          # Expect tree 93f8793cb76fac1627e08ac746223d4fa3b35f57
          # (base 39e930a + patch)
          test "$(git write-tree)" = "93f8793cb76fac1627e08ac746223d4fa3b35f57"

      - name: Commit and push
        run: |
          git commit -m "LilaShift 5.0.0 fix6: flaky waitForIdle deadline"
          git push origin feature/lilashift-5.0

      - name: Clean up patch file
        if: always()
        # The patch file was already removed from the index by the
        # verify step, so it is not in the fix commit; it is only an
        # untracked file on disk in this ephemeral runner. Delete it
        # from disk; there is nothing to commit.
        run: |
          rm -f lilashift-5.0-fix6.patch
          git status --porcelain
