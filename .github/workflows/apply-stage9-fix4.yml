name: Apply Stage 9-fix4 Patch

on:
  workflow_dispatch:
    inputs:
      patch:
        description: 'Patch file in repo root'
        required: true
        default: 'stage9-fix4.patch'
      base_sha:
        description: 'Expected base commit on the branch'
        required: true
        default: '4a71eaba7fad8f22e936b558327f99a9b30333db'
      expected_tree:
        description: 'Expected tree hash after applying'
        required: true
        default: '529975d3517431717c04a99286867e046677d6fe'
      commit_message:
        description: 'Commit message for the applied patch'
        required: true
        default: 'Stage 9 fix4'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Check base is ancestor
        run: |
          git merge-base --is-ancestor "${{ inputs.base_sha }}" HEAD || {
            echo "Base ${{ inputs.base_sha }} is not an ancestor of HEAD $(git rev-parse HEAD)"
            exit 1
          }
          echo "Base OK: ${{ inputs.base_sha }} is ancestor of $(git rev-parse HEAD)"

      - name: Apply patch
        run: |
          test -f "${{ inputs.patch }}" || { echo "Patch file missing: ${{ inputs.patch }}"; exit 1; }
          git apply --check "${{ inputs.patch }}"
          git apply "${{ inputs.patch }}"
          git status --porcelain

      - name: Verify staged files
        run: |
          git add -A
          echo "--- staged files ---"
          git diff --cached --name-only
          echo "--- shortstat ---"
          git diff --cached --shortstat
          staged="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          test "$staged" = "1" || { echo "Expected 1 staged file, got $staged"; exit 1; }
          git diff --cached --name-only | grep -qxF ".github/workflows/apply-stage9-fix4.yml" && { echo "Workflow file must not be in staged patch files"; exit 1; } || true
          grep -qxF "${{ inputs.patch }}" <(git diff --cached --name-only) && { echo "Patch file must not be in staged patch files"; exit 1; } || true
          shortstat="$(git diff --cached --shortstat | sed 's/^ *//')"
          test "$shortstat" = "1 file changed, 7 insertions(+), 3 deletions(-)" || { echo "Unexpected shortstat: $shortstat"; exit 1; }

      - name: Verify tree hash
        run: |
          git rm --cached -q "${{ inputs.patch }}" .github/workflows/apply-stage9-fix4.yml
          tree="$(git write-tree)"
          echo "Tree: $tree"
          test "$tree" = "${{ inputs.expected_tree }}" || { echo "Tree mismatch: expected ${{ inputs.expected_tree }}, got $tree"; exit 1; }
          echo "Tree hash verified. The index is left exactly as verified: no git reset and no git add -A before commit."

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && { echo "Nothing to commit"; exit 1; }
          git commit -m "${{ inputs.commit_message }}"
          git push origin HEAD

      - name: Cleanup scaffolding
        if: always()
        run: |
          echo "--- files in index ---"
          git ls-files
          echo "--- status ---"
          git status --porcelain
          if git ls-files --error-unmatch "${{ inputs.patch }}" >/dev/null 2>&1; then
            echo "Removing patch file from index and disk"
            git rm -q "${{ inputs.patch }}" || true
          else
            echo "Patch file is not in the index (already removed)"
          fi
          if git ls-files --error-unmatch .github/workflows/apply-stage9-fix4.yml >/dev/null 2>&1; then
            echo "Removing workflow file from index and disk"
            git rm -q .github/workflows/apply-stage9-fix4.yml || true
          else
            echo "Workflow file is not in the index (already removed)"
          fi
          echo "--- final status ---"
          git status --porcelain
          git show HEAD:"${{ inputs.patch }}" >/dev/null 2>&1 && { echo "ERROR: patch file is in HEAD"; exit 1; } || echo "Patch file is not in HEAD"
          git show HEAD:.github/workflows/apply-stage9-fix4.yml >/dev/null 2>&1 && { echo "ERROR: workflow file is in HEAD"; exit 1; } || echo "Workflow file is not in HEAD"
