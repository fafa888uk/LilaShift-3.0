name: Apply LilaShift 5.0 Fix 3

# One-shot: apply lilashift-5.0-fix3.patch (fix3: immutable let init on the
# fix2 baseline) to the 5.0 branch.
# The patch file must already be uploaded to the branch root.
# Patch SHA-256: f67ee43447133dab50dfad7505480f47547d62485be4f5386f740987833dd12a (verified)
# Base: feature/lilashift-5.0 @ eaacbce
#   ("LilaShift 5.0.0 fix2: ambiguous init", tree 775fdec9).
# Dispatch with ref = feature/lilashift-5.0.
#
# This file must exist identically on main (so it can be dispatched)
# and on feature/lilashift-5.0 (so the run checks out the branch
# with the patch file). It stays on main afterwards as scaffolding.
#
# TEMPLATE SOURCE (authoritative): the fix1 workflow as it exists
# on main @ e707691, which includes the fetch-depth: 0 fix and ran
# green. Only the parameters below were changed for fix3.
#
# PLACEHOLDERS -- all filled in after fix3 landed (2026-11-28):
#   SHA-256 f67ee43447133dab50dfad7505480f47547d62485be4f5386f740987833dd12a
#   1 file, +8/-2, expected tree eb2b0e94d762400f2e79cc33bc60f45011e83b50
#   (local fix3 commit b573342, verified by clean-checkout apply test)
#   Commit message "LilaShift 5.0.0 fix3: immutable let init" confirmed by the coordinator.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/lilashift-5.0
          fetch-depth: 0

      - name: Verify baseline is an ancestor
        run: |
          git merge-base --is-ancestor eaacbce462bc47ccc3d4904bf9131371e8af64c4 HEAD
          echo "base eaacbce is an ancestor of HEAD"

      - name: Verify patch file
        run: |
          ls -l lilashift-5.0-fix3.patch
          echo "f67ee43447133dab50dfad7505480f47547d62485be4f5386f740987833dd12a  lilashift-5.0-fix3.patch" | sha256sum -c -

      - name: Apply patch
        run: |
          git config user.name "fafa888uk"
          git config user.email "fafa888uk@users.noreply.github.com"
          git apply --index lilashift-5.0-fix3.patch

      - name: Verify staged files
        run: |
          echo "=== staged files ==="
          git diff --cached --name-only
          echo "=== staged stat ==="
          git diff --cached --stat
          # Expect exactly 1 file, +8/-2
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git diff --cached --name-only | grep -qxF "GestaltX/MGKeysTable.swift"
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print s}')" -eq 8
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print d}')" -eq 2
          # The branch also tracks the uploaded patch file and this
          # workflow file, so the staged tree includes them and can
          # never equal the expected tree. Remove them from the index
          # (disk copies stay) before comparing the tree.
          git rm --cached -q lilashift-5.0-fix3.patch .github/workflows/apply-lilashift-5.0-fix3.yml
          # Expect tree eb2b0e94d762400f2e79cc33bc60f45011e83b50
          # (base eaacbce + patch)
          test "$(git write-tree)" = "eb2b0e94d762400f2e79cc33bc60f45011e83b50"

      - name: Commit and push
        run: |
          git commit -m "LilaShift 5.0.0 fix3: immutable let init"
          git push origin feature/lilashift-5.0

      - name: Clean up patch file
        if: always()
        # The patch file was already removed from the index by the
        # verify step, so it is not in the fix commit; it is only an
        # untracked file on disk in this ephemeral runner. Delete it
        # from disk; there is nothing to commit.
        run: |
          rm -f lilashift-5.0-fix3.patch
          git status --porcelain
