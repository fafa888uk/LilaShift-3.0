name: Apply 1.0.8 rebase Phase 0-1

# One-shot: apply lilashift-108-phase01.patch (Afloat16 fixes
# #131-#140 from upstream GestaltX 683649f) to the 1.0.8 rebase
# branch. The patch file must already be uploaded to the branch root.
# Dispatch with ref = feature/lilashift-108-rebase.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/lilashift-108-rebase

      - name: Verify patch file
        run: |
          ls -l lilashift-108-phase01.patch
          sha256sum lilashift-108-phase01.patch

      - name: Apply patch
        run: |
          git config user.name "fafa920q-hue"
          git config user.email "fafa920q-hue@users.noreply.github.com"
          git apply --index lilashift-108-phase01.patch

      - name: Verify staged files
        run: |
          echo "=== staged files ==="
          git diff --cached --name-only
          echo "=== staged stat ==="
          git diff --cached --stat
          # Expect exactly 19 files, +1459/-33
          test "$(git diff --cached --name-only | wc -l)" -eq 19
          git diff --cached --name-only | grep -qxF "GestaltX/GestaltDocument.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/GestaltManager.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/ContentView.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/DeviceCacheOptions.swift"
          git diff --cached --name-only | grep -qxF "Shared/SharedPlistInbox.swift"
          git diff --cached --name-only | grep -qxF "tests/CacheUUIDCaseTests.swift"
          git diff --cached --name-only | grep -qxF "tests/run_field_search.py"
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print s}')" -eq 1459
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print d}')" -eq 33
          # The branch also tracks the uploaded patch file and this
          # workflow file, so the staged tree includes them and can
          # never equal the expected tree. Remove them from the index
          # (disk copies stay) before comparing the tree.
          git rm --cached -q lilashift-108-phase01.patch .github/workflows/apply-108-phase01.yml
          # Expect tree a80e8a347f97e7325aa6b8dd4777d9c55f8711c0
          # (current main 8c4d375 + patch)
          test "$(git write-tree)" = "a80e8a347f97e7325aa6b8dd4777d9c55f8711c0"

      - name: Commit and push
        run: |
          git commit -m "feat(108): port Afloat16 fixes #131-#140 (Phase 1)

          Ports upstream GestaltX Afloat16 fixes #131-#140 (commit
          683649f; upstream has no v1.0.8 tag) onto LilaShift 3.0:
          CacheUUID case-insensitive compare, strict ISO 8601
          date-field input, share-inbox fallback API, backup filename
          identity check, field-search preview reuse, field-edit
          precedence over layout presets, plist key identity
          preservation, exact plist comparison, single-pass document
          diff. Includes 10 new @main test programs + 4 Python
          runners (runner-driven, not in the Xcode test target).
          Not ported in this phase: #135 scan allocation reduction
          (Key-enum scanner, Phase 4) and #133 share-extension
          wiring (follow-up). Branding: 'Sign GestaltX' corrected
          to 'Sign LilaShift'. No bundle ID / App Group / version
          change; no NeoSpring credits; no Airlift exploit."
          git push origin feature/lilashift-108-rebase

      - name: Clean up patch file
        # The patch file was already removed from the index by the
        # verify step, so it is not in the fix commit; it is only an
        # untracked file on disk in this ephemeral runner. Delete it
        # from disk; there is nothing to commit.
        run: |
          rm -f lilashift-108-phase01.patch
          git status --porcelain
