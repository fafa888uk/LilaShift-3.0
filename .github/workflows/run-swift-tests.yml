name: Run Swift Tests

## Runs the XCTest unit-test target (GestaltXTests) on the iOS simulator.
## The P0-era @main test programs were converted to XCTestCase form so CI
## actually compiles and runs them; a green check here means the Swift
## tests passed, not just that the app compiles (see the Build IPA
## workflow for the compile-only gate).
##
## The workflow fails when any test fails (xcodebuild test exits non-zero),
## and it runs on pull requests targeting main (so PR #1 carries it) and
## on pushes to the P0 branch.

on:
  push:
    branches: [main, dev/p0-security-fixes, feature/lilashift-3.0-dashboard, feature/lila-siri-ai-mode, feature/lilashift-4.0-quality-upgrade]
  pull_request:
    branches: [main, feature/lila-siri-ai-mode, feature/lilashift-4.0-quality-upgrade]
  workflow_dispatch:

concurrency:
  group: swift-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run unit tests
        # tee saves the xcodebuild log for the job-summary step below.
        # The runner shell is /bin/bash -e without pipefail, so pipefail
        # is set explicitly below: without it a failing xcodebuild is
        # masked by tee's exit 0 and the step passes while running zero tests (Tests #254/#255).
        run: |
          set -o pipefail
          xcodebuild test \
            -project GestaltX.xcodeproj \
            -scheme GestaltX \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:GestaltXTests 2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"

      - name: Upload snapshot references
        # The ViewSnapshotTests record their references on the first
        # run (record: .missing) into tests/__Snapshots__/. Upload
        # them so they can be downloaded and committed; without this
        # step the first run's recordings would be lost. Runs even
        # when the tests fail, so a failure diff is also captured.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-references
          path: tests/__Snapshots__/
          if-no-files-found: ignore

      - name: Collect snapshot failure renders
        # On a mismatch, SnapshotTesting writes the actual render to
        # the simulator's /tmp (record: .missing never overwrites
        # the reference), so the references artifact alone cannot
        # show what differed — Tests #196's two mismatches were
        # undiagnosable from it. Collect any failure renders so the
        # next mismatch can be located pixel by pixel.
        if: always()
        run: |
          mkdir -p /tmp/snapshot-failures
          find ~/Library/Developer/CoreSimulator -type f -name '*.png' \
            \( -path '*/tmp/DashboardV3SnapshotTests/*' -o -path '*/tmp/ViewSnapshotTests/*' \) \
            -exec cp {} /tmp/snapshot-failures/ \; 2>/dev/null || true
          ls -la /tmp/snapshot-failures/

      - name: Upload snapshot failure renders
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-failures
          path: /tmp/snapshot-failures/
          if-no-files-found: ignore

      - name: Publish job summary
        # Writes a short summary (SHA, version, test counts) to the run
        # page. Never fails the job: every parse is guarded and falls
        # back to "not parsed" / "unknown".
        if: always()
        run: |
          version="$(sed -n 's/^[[:space:]]*MARKETING_VERSION = \(.*\);/\1/p' GestaltX.xcodeproj/project.pbxproj | sort -u || true)"
          build="$(sed -n 's/^[[:space:]]*CURRENT_PROJECT_VERSION = \(.*\);/\1/p' GestaltX.xcodeproj/project.pbxproj | sort -u || true)"
          [ -n "$version" ] || version="unknown"
          [ -n "$build" ] || build="unknown"
          log="$RUNNER_TEMP/xcodebuild-test.log"
          executed="not parsed"
          skipped="not parsed"
          failed="not parsed"
          if [ -f "$log" ]; then
            line="$(grep -E 'Executed [0-9]+ tests' "$log" | tail -n 1 || true)"
            if [ -n "$line" ]; then
              executed="$(printf '%s' "$line" | grep -oE 'Executed [0-9]+' | grep -oE '[0-9]+' || true)"
              skipped="$(printf '%s' "$line" | grep -oE '[0-9]+ tests? skipped' | grep -oE '[0-9]+' || true)"
              failed="$(printf '%s' "$line" | grep -oE '[0-9]+ failures' | grep -oE '[0-9]+' || true)"
              [ -n "$executed" ] || executed="not parsed"
              [ -n "$skipped" ] || skipped="not parsed"
              [ -n "$failed" ] || failed="not parsed"
            fi
          fi
          {
            echo "## Run Swift Tests"
            echo ""
            echo "- Commit: ${{ github.sha }}"
            echo "- Ref: ${{ github.ref }}"
            echo "- Version: $version ($build)"
            echo "- Tests executed: $executed"
            echo "- Tests skipped: $skipped"
            echo "- Tests failed: $failed"
            echo "- Conclusion: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY" || true
