name: Apply LilaShift 5.0 Merge Fix 1

# One-shot: apply lilashift-5.0-merge-fix1.patch (merge fix1: xcstrings
# conflict on the merge baseline) to the 5.0 branch.
# The patch file must already be uploaded to the branch root.
# Patch SHA-256: c252ef9bff4f5af27a8a73c5b98c9389d55be2a51e159c2ca68f0fccb3c2bd00 (verified)
# Base: feature/lilashift-5.0 @ 8072871
#   ("LilaShift 5.0.0 merge: 4.2.0 + official API into one IPA").
# Dispatch with ref = feature/lilashift-5.0.
#
# This file must exist identically on main (so it can be dispatched)
# and on feature/lilashift-5.0 (so the run checks out the branch
# with the patch file). It stays on main afterwards as scaffolding.
#
# TEMPLATE SOURCE (authoritative): the fix1 apply workflow as it
# exists on main @ e707691, copied verbatim except for the
# parameters below (patch name, SHA-256, base, expected tree, file
# count / statistics, commit message). That template includes the
# fetch-depth: 0 fix.
#
# PLACEHOLDERS -- all filled in after the fix landed locally
# (2026-11-29):
#   SHA-256 c252ef9bff4f5af27a8a73c5b98c9389d55be2a51e159c2ca68f0fccb3c2bd00
#   13 files, +3014/-97, expected tree 8b5b4b01b3153a8ec68653a1951b282fdb2b6a7a
#   (local merge-fix1 commit 72af915, verified by clean-checkout apply test)
#   Commit message "LilaShift 5.0.0 merge fix1: xcstrings conflict"
#   confirmed by the coordinator.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/lilashift-5.0
          fetch-depth: 0

      - name: Verify baseline is an ancestor
        run: |
          git merge-base --is-ancestor 8072871b2fc71a8294f06f8df236e3a97c296abf HEAD
          echo "base 8072871 is an ancestor of HEAD"

      - name: Verify patch file
        run: |
          ls -l lilashift-5.0-merge-fix1.patch
          echo "c252ef9bff4f5af27a8a73c5b98c9389d55be2a51e159c2ca68f0fccb3c2bd00  lilashift-5.0-merge-fix1.patch" | sha256sum -c -

      - name: Apply patch
        run: |
          git config user.name "fafa888uk"
          git config user.email "fafa888uk@users.noreply.github.com"
          git apply --index lilashift-5.0-merge-fix1.patch

      - name: Verify staged files
        run: |
          echo "=== staged files ==="
          git diff --cached --name-only
          echo "=== staged stat ==="
          git diff --cached --stat
          # Expect exactly 13 files, +3014/-97
          test "$(git diff --cached --name-only | wc -l)" -eq 13
          git diff --cached --name-only | grep -qxF "GestaltX/Localizable.xcstrings"
          git diff --cached --name-only | grep -qxF "GestaltX/en.lproj/Localizable.strings"
          git diff --cached --name-only | grep -qxF "GestaltX/zh-Hans.lproj/Localizable.strings"
          git diff --cached --name-only | grep -qxF "localization/es.json"
          git diff --cached --name-only | grep -qxF "localization/fa.json"
          git diff --cached --name-only | grep -qxF "localization/ja.json"
          git diff --cached --name-only | grep -qxF "localization/ko.json"
          git diff --cached --name-only | grep -qxF "localization/ru.json"
          git diff --cached --name-only | grep -qxF "localization/vi.json"
          git diff --cached --name-only | grep -qxF "localization/zh-Hant-HK.json"
          git diff --cached --name-only | grep -qxF "localization/zh-Hant-TW.json"
          git diff --cached --name-only | grep -qxF "scripts/generate_localization.py"
          git diff --cached --name-only | grep -qxF "tests/VerifiedChangeTests.swift"
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print s}')" -eq 3014
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print d}')" -eq 97
          # The branch also tracks the uploaded patch file and this
          # workflow file, so the staged tree includes them and can
          # never equal the expected tree. Remove them from the index
          # (disk copies stay) before comparing the tree.
          git rm --cached -q lilashift-5.0-merge-fix1.patch .github/workflows/apply-lilashift-5.0-merge-fix1.yml
          # Expect tree 8b5b4b01b3153a8ec68653a1951b282fdb2b6a7a
          # (base 8072871 + patch)
          test "$(git write-tree)" = "8b5b4b01b3153a8ec68653a1951b282fdb2b6a7a"

      - name: Commit and push
        run: |
          git commit -m "LilaShift 5.0.0 merge fix1: xcstrings conflict"
          git push origin feature/lilashift-5.0

      - name: Clean up patch file
        if: always()
        # The patch file was already removed from the index by the
        # verify step, so it is not in the fix commit; it is only an
        # untracked file on disk in this ephemeral runner. Delete it
        # from disk; there is nothing to commit.
        run: |
          rm -f lilashift-5.0-merge-fix1.patch
          git status --porcelain
