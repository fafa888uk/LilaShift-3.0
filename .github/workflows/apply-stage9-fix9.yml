name: Apply Stage 9-fix9 Patch

on:
  workflow_dispatch:
    inputs:
      patch_file:
        description: 'Patch file in repo root'
        required: true
        default: 'stage9-fix9.patch'
        type: string
      base_sha:
        description: 'Expected base commit (Stage 9 fix8)'
        required: true
        default: '5c3905ccf8f5d396c56f24d581c1b6decadb5f68'
        type: string
      expected_tree:
        description: 'Expected tree hash after applying the patch'
        required: true
        default: '90a9ef5bdddb6dfcd1a4ff533ea4f96aa85caf8d'
        type: string
      commit_message:
        description: 'Commit message for the applied patch'
        required: true
        default: 'Stage 9 fix9'
        type: string

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify base commit
        run: |
          git merge-base --is-ancestor "${{ inputs.base_sha }}" HEAD || {
            echo "Base ${{ inputs.base_sha }} is not an ancestor of HEAD $(git rev-parse HEAD)"
            exit 1
          }

      - name: Apply patch
        run: |
          test -f "${{ inputs.patch_file }}"
          git apply --binary --whitespace=fix "${{ inputs.patch_file }}"

      - name: Verify staged files
        run: |
          git add -A
          test "$(git diff --cached --name-only | wc -l)" -eq 9 || {
            echo "Expected exactly 9 staged files, got:"
            git diff --cached --name-only
            exit 1
          }
          git diff --cached --name-only | grep -qxF ".github/workflows/apply-stage9-fix9.yml" && {
            echo "Workflow file must not be part of the patch"
            exit 1
          }
          STAT="$(git diff --cached --shortstat | sed 's/^ *//')"
          test "$STAT" = "9 files changed, 56 insertions(+), 11 deletions(-)" || {
            echo "Unexpected staged stats: $STAT"
            exit 1
          }

      - name: Verify tree hash
        run: |
          git rm --cached -q stage9-fix9.patch
          git rm --cached -q .github/workflows/apply-stage9-fix9.yml
          git ls-files --error-unmatch stage9-fix9.patch && exit 1 || true
          git ls-files --error-unmatch .github/workflows/apply-stage9-fix9.yml && exit 1 || true
          TREE="$(git write-tree)"
          test "$TREE" = "${{ inputs.expected_tree }}" || {
            echo "Unexpected tree: $TREE (expected ${{ inputs.expected_tree }})"
            git status --short
            exit 1
          }

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Stage 9 fix9"
          git push origin HEAD:${{ github.ref_name }}

      - name: Cleanup
        if: always()
        run: |
          rm -f stage9-fix9.patch .github/workflows/apply-stage9-fix9.yml
          git status --short
          git diff --cached --name-only
