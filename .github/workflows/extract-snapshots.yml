name: Extract Snapshot References

# One-shot: download the snapshot-references artifact from the
# fix5 Tests run (#480, run id 46147223181) and commit the 6
# re-recorded PNGs to the 5.0 branch, so the next Tests run goes green.
# Artifact name is discovered dynamically via the API; no hardcoded
# artifact name is assumed.
# Dispatch with ref = feature/lilashift-5.0.
#
# This file must exist identically on main (so it can be dispatched)
# and on feature/lilashift-5.0. It stays on main afterwards as scaffolding.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/lilashift-5.0
          fetch-depth: 0

      - name: Find and download snapshot artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== artifacts on run 46147223181 ==="
          gh api repos/fafa888uk/LilaShift-3.0/actions/runs/46147223181/artifacts --jq '.artifacts[] | "\(.id) \(.name) expired=\(.expired)"'
          ART_ID=$(gh api repos/fafa888uk/LilaShift-3.0/actions/runs/46147223181/artifacts --jq '.artifacts[] | select(.name | startswith("snapshot-references")) | .id' | head -n 1)
          test -n "$ART_ID"
          echo "artifact id: $ART_ID"
          gh api repos/fafa888uk/LilaShift-3.0/actions/artifacts/$ART_ID/zip > snapshot.zip
          ls -l snapshot.zip
          mkdir -p snapshot-artifact
          unzip -o -q snapshot.zip -d snapshot-artifact
          echo "=== PNGs in artifact ==="
          find snapshot-artifact -name "*.png" | sort

      - name: Copy PNGs into place
        run: |
          for png in testV3HomePopulatedAccessibilitySnapshot.v3-home-populated-accessibility.png testV3HomePopulatedNarrowSnapshot.v3-home-populated-narrow-320.png testV3HomePopulatedSnapshot.v3-home-populated.png testV3HomeUnreadSnapshot.v3-home-unread.png; do
            src=$(find snapshot-artifact -name "$png" -print -quit)
            test -n "$src" || { echo "MISSING: $png"; exit 1; }
            cp "$src" "tests/__Snapshots__/DashboardV3SnapshotTests/$png"
            echo "placed $png from $src"
          done
          for png in testPersonalizationCenterCardPopulatedSnapshot.personalization-center-populated.png testPersonalizationCenterCardUnreadSnapshot.personalization-center-unread.png; do
            src=$(find snapshot-artifact -name "$png" -print -quit)
            test -n "$src" || { echo "MISSING: $png"; exit 1; }
            cp "$src" "tests/__Snapshots__/ViewSnapshotTests/$png"
            echo "placed $png from $src"
          done
          echo "=== PNG sizes ==="
          ls -l tests/__Snapshots__/DashboardV3SnapshotTests/*.png tests/__Snapshots__/ViewSnapshotTests/*.png
          git status --porcelain

      - name: Commit and push
        run: |
          git config user.name "fafa888uk"
          git config user.email "fafa888uk@users.noreply.github.com"
          git add tests/__Snapshots__/DashboardV3SnapshotTests/ tests/__Snapshots__/ViewSnapshotTests/
          git commit -m "LilaShift 5.0.0: re-recorded snapshot references"
          git push origin feature/lilashift-5.0
