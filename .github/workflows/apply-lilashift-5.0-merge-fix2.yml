name: Apply LilaShift 5.0 Merge Fix 2

# One-shot: apply lilashift-5.0-merge-fix2.patch (merge fix2: missing
# Combine import for UnifiedOperationLog) to the 5.0 branch.
# The patch file must already be uploaded to the branch root.
# Patch SHA-256: 1154b5ea101c4f9c27ef80a350486e8438b6c1859516f0e2e0b4f11b33f33308 (verified)
# Base: feature/lilashift-5.0 @ d0be0bc
#   ("LilaShift 5.0.0 merge fix1: xcstrings conflict").
# Dispatch with ref = feature/lilashift-5.0.
#
# This file must exist identically on main (so it can be dispatched)
# and on feature/lilashift-5.0 (so the run checks out the branch
# with the patch file). It stays on main afterwards as scaffolding.
#
# TEMPLATE SOURCE (authoritative): the fix1 apply workflow as it
# exists on main @ e707691, copied verbatim except for the
# parameters below (patch name, SHA-256, base, expected tree, file
# count / statistics, commit message). That template includes the
# fetch-depth: 0 fix.
#
# PLACEHOLDERS -- all filled in after the fix landed locally
# (2026-11-29):
#   SHA-256 1154b5ea101c4f9c27ef80a350486e8438b6c1859516f0e2e0b4f11b33f33308
#   1 file, +1/-0, expected tree c3f8956fe8abc2f739628ed513d2e28531390c32
#   (local merge-fix2 commit c794fef, verified by clean-checkout apply test)
#   Commit message "LilaShift 5.0.0 merge fix2: missing Combine import for UnifiedOperationLog"
#   confirmed by the coordinator.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/lilashift-5.0
          fetch-depth: 0

      - name: Verify baseline is an ancestor
        run: |
          git merge-base --is-ancestor d0be0bcc8a002d083a44deb485d54da9a27c83dd HEAD
          echo "base d0be0bc is an ancestor of HEAD"

      - name: Verify patch file
        run: |
          ls -l lilashift-5.0-merge-fix2.patch
          echo "1154b5ea101c4f9c27ef80a350486e8438b6c1859516f0e2e0b4f11b33f33308  lilashift-5.0-merge-fix2.patch" | sha256sum -c -

      - name: Apply patch
        run: |
          git config user.name "fafa888uk"
          git config user.email "fafa888uk@users.noreply.github.com"
          git apply --index lilashift-5.0-merge-fix2.patch

      - name: Verify staged files
        run: |
          echo "=== staged files ==="
          git diff --cached --name-only
          echo "=== staged stat ==="
          git diff --cached --stat
          # Expect exactly 1 file, +1/-0
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git diff --cached --name-only | grep -qxF "GestaltX/UnifiedOperationLogView.swift"
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print s}')" -eq 1
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print d}')" -eq 0
          # The branch also tracks the uploaded patch file and this
          # workflow file, so the staged tree includes them and can
          # never equal the expected tree. Remove them from the index
          # (disk copies stay) before comparing the tree.
          git rm --cached -q lilashift-5.0-merge-fix2.patch .github/workflows/apply-lilashift-5.0-merge-fix2.yml
          # Expect tree c3f8956fe8abc2f739628ed513d2e28531390c32
          # (base d0be0bc + patch)
          test "$(git write-tree)" = "c3f8956fe8abc2f739628ed513d2e28531390c32"

      - name: Commit and push
        run: |
          git commit -m "LilaShift 5.0.0 merge fix2: missing Combine import for UnifiedOperationLog"
          git push origin feature/lilashift-5.0

      - name: Clean up patch file
        if: always()
        # The patch file was already removed from the index by the
        # verify step, so it is not in the fix commit; it is only an
        # untracked file on disk in this ephemeral runner. Delete it
        # from disk; there is nothing to commit.
        run: |
          rm -f lilashift-5.0-merge-fix2.patch
          git status --porcelain
