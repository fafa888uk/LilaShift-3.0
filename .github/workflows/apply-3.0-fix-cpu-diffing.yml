name: Apply 3.0 CPU diffing fix

# One-shot: apply lilashift-3.0-fix-cpu-diffing.patch (CPU-only
# perceptual image diffing for snapshot tests) to the 3.0 branch.
# The patch file must already be uploaded to the branch root.
# Dispatch with ref = feature/lilashift-3.0-dashboard.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/lilashift-3.0-dashboard

      - name: Verify patch file
        run: |
          ls -l lilashift-3.0-fix-cpu-diffing.patch
          sha256sum lilashift-3.0-fix-cpu-diffing.patch

      - name: Apply patch
        run: |
          git config user.name "fafa920q-hue"
          git config user.email "fafa920q-hue@users.noreply.github.com"
          git apply --index lilashift-3.0-fix-cpu-diffing.patch

      - name: Verify staged files
        run: |
          echo "=== staged files ==="
          git diff --cached --name-only
          echo "=== staged stat ==="
          git diff --cached --stat
          # Expect exactly 4 files
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git diff --cached --name-only | grep -qxF "GestaltX.xcodeproj/project.pbxproj"
          git diff --cached --name-only | grep -qxF "tests/CPUImageDiffing.swift"
          git diff --cached --name-only | grep -qxF "tests/DashboardV3SnapshotTests.swift"
          git diff --cached --name-only | grep -qxF "tests/ViewSnapshotTests.swift"
          # Expect +299/-2
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print s}')" -eq 299
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print d}')" -eq 2

      - name: Commit and push
        run: |
          git commit -m "fix(tests): CPU-only perceptual image diffing for snapshot tests

          swift-snapshot-testing 1.19.7 thresholds the CILabDeltaE image
          with a Metal kernel (MPSImageThresholdBinary) whenever Metal is
          available. On GitHub's virtualized runners the Metal device is
          host-dependent: the same Tools/Unlock pixels measure at most
          Delta-E 1.52 yet the harness reports max Delta-E 13.1, failing
          tests that pass on other hosts with identical code, baselines
          and captures. This replaces the library's Metal-based
          perceptual comparison with a CPU-only CIE76 Delta-E computed
          in pure Swift (tests/CPUImageDiffing.swift); thresholds are
          unchanged (precision 1, perceptualPrecision 0.98)."
          git push origin feature/lilashift-3.0-dashboard

      - name: Clean up patch file
        run: |
          git rm -q lilashift-3.0-fix-cpu-diffing.patch
          git commit -m "chore: remove applied CPU diffing patch file"
          git push origin feature/lilashift-3.0-dashboard
