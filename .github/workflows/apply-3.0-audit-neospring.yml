# Apply the 3.0 audit+NeoSpring combined patch (one-shot)
#
# Manually dispatched once, on feature/lilashift-3.0-dashboard:
# applies lilashift-3.0-audit-neospring-combined.patch (the OSS
# audit registry + the NeoSpring removal, combined, on top of the
# fix2 HEAD fc02289) and commits the result to the current branch.
# Do NOT re-run after the patch is applied: git apply --check
# fails when the changes are already in the tree, and the run
# stops before committing.
#
# The patch touches only source/docs/test files (no workflow
# files), so `contents: write` is sufficient. The check-licenses
# workflow (.github/workflows/check-licenses.yml) is created via
# the web editor in the same transport, not by this patch.
name: Apply 3.0 audit+NeoSpring combined patch
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Apply the combined patch
        run: |
          git apply --check lilashift-3.0-audit-neospring-combined.patch
          git apply lilashift-3.0-audit-neospring-combined.patch
          python3 -X utf8 scripts/generate_localization.py
          python3 -X utf8 tests/LocalizationTests.py
          python3 -X utf8 tests/ThirdPartyNoticesTests.py
          python3 -X utf8 tests/PrepareReleaseTests.py
          python3 -X utf8 scripts/check-licenses.py

      - name: Commit the applied patch
        run: |
          git config user.name "fafa920q-hue"
          git config user.email "fafa920q-hue@users.noreply.github.com"
          find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true
          git add -A
          git status --short
          git commit -m "docs+fix(3.0): OSS audit registry + remove unlicensed NeoSpring respring"
          git push
