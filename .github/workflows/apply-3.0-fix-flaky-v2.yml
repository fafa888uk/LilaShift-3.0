# Apply the 3.0 flaky-snapshot settle patch, revision 2 (one-shot)
#
# Manually dispatched once, on feature/lilashift-3.0-dashboard:
# revision 2 of the snapshot-settle fix. Revision 1 (commit
# f9434a7) added three settles to the two snapshot helpers, but
# Tests #215 failed to compile on the third one:
# `.environment(\.accessibilityReduceMotion, true)` — that key
# path is read-only and `View.environment` requires a writable
# key path. This revision removes exactly those two lines and
# corrects the comments; `.wait(for: 0.5, on: .image(...))` and
# the nil-animation transaction are kept unchanged (they compiled
# in #215 — the only errors were the two .environment lines).
# Thresholds unchanged (precision 1, perceptualPrecision 0.98),
# no test skipped, no baseline re-recorded, no production code.
#
# This patch touches only 2 test files, so `contents: write` is
# sufficient (no workflow file is involved, so no split is needed).
# NOTE: use `git apply --index` (not plain `git apply`) — plain
# apply only changes the worktree, leaving `git diff --cached`
# empty and the later `git commit` with nothing staged.
# NOTE 2: verification must not use grep "M\t..." — GNU grep does
# not interpret \t as a tab. Compare plain paths via --name-only
# instead; --name-status output uses real tabs, so check the status
# letters through cut -f1.
# Do NOT re-run after the patch is applied: git apply --check fails
# when the changes are already in the tree, and the run stops before
# committing.
name: Apply 3.0 flaky snapshot fix v2
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Verify patch file and apply it
        run: |
          test "$(wc -c < lilashift-3.0-fix-flaky-snapshots-v2.patch | tr -d ' ')" = "3548"
          test "$(sha256sum lilashift-3.0-fix-flaky-snapshots-v2.patch | cut -d' ' -f1)" = "468f801525f407e8b92ef13f0728c57ede19998e27c11803e96e95d1151cdac6"
          git apply --check lilashift-3.0-fix-flaky-snapshots-v2.patch
          git apply --index lilashift-3.0-fix-flaky-snapshots-v2.patch

      - name: Verify the diff is exactly the 2 test files
        run: |
          git diff --cached --name-only > /tmp/changed.txt
          cat /tmp/changed.txt
          test "$(wc -l < /tmp/changed.txt | tr -d ' ')" = "2"
          grep -qxF "tests/DashboardV3SnapshotTests.swift" /tmp/changed.txt
          grep -qxF "tests/ViewSnapshotTests.swift" /tmp/changed.txt
          test "$(git diff --cached --name-status | cut -f1 | sort -u)" = "M"
          test "$(git diff --cached --shortstat | grep -o '[0-9]* insertions' | grep -o '[0-9]*')" = "15"
          test "$(git diff --cached --shortstat | grep -o '[0-9]* deletions' | grep -o '[0-9]*')" = "10"

      - name: Commit the fix
        run: |
          git config user.name "fafa920q-hue"
          git config user.email "fafa920q-hue@users.noreply.github.com"
          git commit -m "fix(tests): drop non-compiling Reduce Motion line from snapshot settle"
          git push
