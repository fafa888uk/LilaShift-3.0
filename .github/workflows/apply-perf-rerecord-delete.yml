# Apply the perf re-record deletion patch (one-shot)
#
# Manually dispatched once, on feature/lila-unified-perf-20261114:
# applies lilashift-perf-rerecord-delete.patch (deletes the 8 stale
# image snapshot references — PresetCatalog, SmartFaultDiagnosis,
# PersonalizationCenter, SystemHealthScore, populated + unread —
# so the next Run Swift Tests records fresh references after the
# shadow-removal change; Run 125 failed on these 8 with
# ViewSnapshotTests mismatches, and the Run 125 artifact contains
# only the old references, so the new images must be re-recorded)
# on top of the branch HEAD and commits the result to the current
# branch. Do NOT re-run after the patch is applied: git apply
# --check fails when the changes are already in the tree, and the
# run stops before committing.
#
# The patch touches only test reference files (no workflow files),
# so `contents: write` is sufficient. The old references stay in
# git history and in the main agent's backup, and are restored if
# the re-recorded images show a real regression.
name: Apply perf re-record deletion
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Apply the re-record deletion patch
        run: |
          git apply --check lilashift-perf-rerecord-delete.patch
          git apply lilashift-perf-rerecord-delete.patch
          python3 -X utf8 tests/LocalizationTests.py
          python3 -X utf8 tests/ThirdPartyNoticesTests.py
          python3 -X utf8 tests/PrepareReleaseTests.py

      - name: Commit the applied patch
        run: |
          git config user.name "fafa920q-hue"
          git config user.email "fafa920q-hue@users.noreply.github.com"
          find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true
          git add -A
          git status --short
          git commit -m "test(snapshots): remove 8 stale snapshot references to re-record after shadow removal (Run 125)"
          git push
