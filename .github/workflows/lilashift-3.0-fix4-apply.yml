# Apply the 3.0 fix4 patch (one-shot)
#
# Manually dispatched once, on feature/lilashift-3.0-dashboard:
# applies lilashift-3.0-fix4.patch (the AboutView Section header/footer
# compile fix + the HomeDiagnosticsCache test fixes, on top of the
# post-audit HEAD e20dd51) and commits the result to the current branch.
# Do NOT re-run after the patch is applied: git apply --check
# fails when the changes are already in the tree, and the run
# stops before committing.
#
# The patch touches only source/test files (no workflow
# files), so `contents: write` is sufficient.
name: Apply 3.0 fix4 patch
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Apply the fix4 patch
        run: |
          git apply --check lilashift-3.0-fix4.patch
          git apply lilashift-3.0-fix4.patch
          python3 -X utf8 scripts/generate_localization.py
          python3 -X utf8 tests/LocalizationTests.py
          python3 -X utf8 tests/ThirdPartyNoticesTests.py
          python3 -X utf8 tests/PrepareReleaseTests.py
          python3 -X utf8 scripts/check-licenses.py

      - name: Commit the applied patch
        run: |
          git config user.name "fafa920q-hue"
          git config user.email "fafa920q-hue@users.noreply.github.com"
          find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true
          git add -A
          git status --short
          git commit -m "fix(v3): AboutView section headers + HomeDiagnosticsCache test fixes"
          git push
