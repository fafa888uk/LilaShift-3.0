name: Apply AI skip fix3

# One-shot: apply lilashift-ai-skip-fix3.patch (drop the `= []`
# default on SafePatchSimulation.skippedFeatureIDs — fixes the IPA
# #251 build failure "immutable value 'self.skippedFeatureIDs' may
# only be initialized once") to the ai-skip branch. The patch file
# must already be uploaded to the branch root.
# Dispatch with ref = feature/lila-ai-skip.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/lila-ai-skip

      - name: Verify patch file
        run: |
          ls -l lilashift-ai-skip-fix3.patch
          sha256sum lilashift-ai-skip-fix3.patch
          test "$(sha256sum lilashift-ai-skip-fix3.patch | cut -d' ' -f1)" = "a27dbd81f8baaed52668aa3cd1609c959fe1f71a7eb670aca2001ff8d5ae863d"

      - name: Apply patch
        run: |
          git config user.name "fafa920q-hue"
          git config user.email "fafa920q-hue@users.noreply.github.com"
          git apply --index --binary lilashift-ai-skip-fix3.patch

      - name: Verify staged files
        run: |
          echo "=== staged files ==="
          git diff --cached --name-only
          echo "=== staged stat ==="
          git diff --cached --stat
          # Expect exactly 1 file, +5/-1
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git diff --cached --name-only | grep -qxF "GestaltX/SafePatch.swift"
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print s}')" -eq 5
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print d}')" -eq 1
          # The branch also tracks the uploaded patch file and this
          # workflow file, so the staged tree includes them and can
          # never equal the expected tree. Remove them from the index
          # (disk copies stay) before comparing the tree.
          git rm --cached -q lilashift-ai-skip-fix3.patch .github/workflows/apply-ai-skip-fix3.yml
          # Expect tree e18046e327efbb77e5a06828ec834b08d0127902
          test "$(git write-tree)" = "e18046e327efbb77e5a06828ec834b08d0127902"

      - name: Commit and push
        run: |
          git commit -m "fix: drop the default on SafePatchSimulation.skippedFeatureIDs (IPA #251)

          The explicit init assigns self.skippedFeatureIDs, but the
          property still carried '= []', so the let was initialized
          twice and the IPA build failed ('immutable value may only
          be initialized once'). The default now lives only on the
          init parameter, so call sites that omit skippedFeatureIDs
          keep compiling. No behavior change."
          git push origin feature/lila-ai-skip

      - name: Clean up patch file
        # The patch file was already removed from the index by the
        # verify step, so it is not in the fix commit; it is only an
        # untracked file on disk in this ephemeral runner. Delete it
        # from disk; there is nothing to commit.
        run: |
          rm -f lilashift-ai-skip-fix3.patch
          git status --porcelain
