name: Apply AI skip fix2

# One-shot: apply lilashift-ai-skip-fix2.patch (explicit init for
# SafePatchSimulation accepting skippedFeatureIDs — fixes the IPA
# #247 build failure "extra argument 'skippedFeatureIDs' in call")
# to the ai-skip branch. The patch file must already be uploaded to
# the branch root.
# Dispatch with ref = feature/lila-ai-skip.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/lila-ai-skip

      - name: Verify patch file
        run: |
          ls -l lilashift-ai-skip-fix2.patch
          sha256sum lilashift-ai-skip-fix2.patch
          test "$(sha256sum lilashift-ai-skip-fix2.patch | cut -d' ' -f1)" = "97856cd76427fc5609b8abf49b5ee81d382e191865a962a36cc61ac05198a6f0"

      - name: Apply patch
        run: |
          git config user.name "fafa920q-hue"
          git config user.email "fafa920q-hue@users.noreply.github.com"
          git apply --index --binary lilashift-ai-skip-fix2.patch

      - name: Verify staged files
        run: |
          echo "=== staged files ==="
          git diff --cached --name-only
          echo "=== staged stat ==="
          git diff --cached --stat
          # Expect exactly 1 file, +34/-0
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git diff --cached --name-only | grep -qxF "GestaltX/SafePatch.swift"
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print s}')" -eq 34
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print d}')" -eq 0
          # The branch also tracks the uploaded patch file and this
          # workflow file, so the staged tree includes them and can
          # never equal the expected tree. Remove them from the index
          # (disk copies stay) before comparing the tree.
          git rm --cached -q lilashift-ai-skip-fix2.patch .github/workflows/apply-ai-skip-fix2.yml
          # Expect tree 1587e047366165c7c4f0ef17cb470bb943ed3adf
          test "$(git write-tree)" = "1587e047366165c7c4f0ef17cb470bb943ed3adf"

      - name: Commit and push
        run: |
          git commit -m "fix: give SafePatchSimulation an explicit init accepting skippedFeatureIDs

          The synthesized memberwise initializer does not accept
          skippedFeatureIDs as an argument (IPA #247 failed to build:
          extra argument 'skippedFeatureIDs' in call at the finish
          call site), so the simulation is built through this
          explicit init. skippedFeatureIDs defaults to [] so call
          sites that omit it keep compiling. No behavior change."
          git push origin feature/lila-ai-skip

      - name: Clean up patch file
        # The patch file was already removed from the index by the
        # verify step, so it is not in the fix commit; it is only an
        # untracked file on disk in this ephemeral runner. Delete it
        # from disk; there is nothing to commit.
        run: |
          rm -f lilashift-ai-skip-fix2.patch
          git status --porcelain
