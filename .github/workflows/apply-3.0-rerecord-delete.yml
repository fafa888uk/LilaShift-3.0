# Apply the 3.0 snapshot re-record deletion patch (one-shot)
#
# Manually dispatched once, on feature/lilashift-3.0-dashboard:
# deletes the 8 stale ViewSnapshotTests baseline PNGs (the 8 known
# mismatches from Tests #180) so the next Tests run re-records them
# (plus the 10 DashboardV3 first-record snapshots) as artifacts.
# Do NOT re-run after the patch is applied: git apply --check
# fails when the deletions are already in the tree, and the run
# stops before committing.
#
# The patch deletes only PNG files (no workflow files),
# so `contents: write` is sufficient.
name: Apply 3.0 re-record deletion patch
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Verify patch file and apply it
        run: |
          test "$(wc -c < lilashift-3.0-rerecord-delete.patch | tr -d ' ')" = "4020"
          test "$(sha256sum lilashift-3.0-rerecord-delete.patch | cut -d' ' -f1)" = "e1073c5c0604b52f0bac1dd065bf963e19cb6639ea3d2d98d788f49a86723e7c"
          git apply --check lilashift-3.0-rerecord-delete.patch
          git apply --index lilashift-3.0-rerecord-delete.patch

      - name: Verify the diff is exactly the 8 deletions
        run: |
          git diff --cached --name-status > /tmp/deleted.txt
          cat /tmp/deleted.txt
          test "$(wc -l < /tmp/deleted.txt | tr -d ' ')" = "8"
          grep -qx "D	tests/__Snapshots__/ViewSnapshotTests/testPersonalizationCenterCardPopulatedSnapshot.personalization-center-populated.png" /tmp/deleted.txt
          grep -qx "D	tests/__Snapshots__/ViewSnapshotTests/testPersonalizationCenterCardUnreadSnapshot.personalization-center-unread.png" /tmp/deleted.txt
          grep -qx "D	tests/__Snapshots__/ViewSnapshotTests/testPresetCatalogCardPopulatedSnapshot.preset-catalog-populated.png" /tmp/deleted.txt
          grep -qx "D	tests/__Snapshots__/ViewSnapshotTests/testPresetCatalogCardUnreadSnapshot.preset-catalog-unread.png" /tmp/deleted.txt
          grep -qx "D	tests/__Snapshots__/ViewSnapshotTests/testSmartFaultDiagnosisCardPopulatedSnapshot.smart-fault-diagnosis-populated.png" /tmp/deleted.txt
          grep -qx "D	tests/__Snapshots__/ViewSnapshotTests/testSmartFaultDiagnosisCardUnreadSnapshot.smart-fault-diagnosis-unread.png" /tmp/deleted.txt
          grep -qx "D	tests/__Snapshots__/ViewSnapshotTests/testSystemHealthScoreCardPopulatedSnapshot.system-health-score-populated.png" /tmp/deleted.txt
          grep -qx "D	tests/__Snapshots__/ViewSnapshotTests/testSystemHealthScoreCardUnreadSnapshot.system-health-score-unread.png" /tmp/deleted.txt

      - name: Commit the deletion
        run: |
          git config user.name "fafa920q-hue"
          git config user.email "fafa920q-hue@users.noreply.github.com"
          git commit -m "test(snapshots): delete 8 stale ViewSnapshot baselines for re-record"
          git push
