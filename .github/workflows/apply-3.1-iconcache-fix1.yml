name: Apply 3.1 icon-cache fixture fix

# One-shot: apply lilashift-3.1-iconcache-fix1.patch (use scoped-literal
# separators in the IconCacheProbeTests write fixture) to the 3.1 branch.
# The patch file must already be uploaded to the branch root.
# Patch SHA-256: 3a601f8f13facf1298ef6c8a4a70e8e83d2770a4afaec9218f5573af43a1971d
# Dispatch with ref = feature/lilashift-3.1-iphone18-2-persistence.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/lilashift-3.1-iphone18-2-persistence

      - name: Verify patch file
        run: |
          ls -l lilashift-3.1-iconcache-fix1.patch
          sha256sum lilashift-3.1-iconcache-fix1.patch

      - name: Apply patch
        run: |
          git config user.name "fafa920q-hue"
          git config user.email "fafa920q-hue@users.noreply.github.com"
          git apply --index lilashift-3.1-iconcache-fix1.patch

      - name: Verify staged files
        run: |
          echo "=== staged files ==="
          git diff --cached --name-only
          echo "=== staged stat ==="
          git diff --cached --stat
          # Expect exactly 1 file
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git diff --cached --name-only | grep -qxF "tests/IconCacheProbeTests.swift"
          # Expect +6/-3
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print s}')" -eq 6
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print d}')" -eq 3

      - name: Commit and push
        run: |
          git commit -m "fix(tests): use scoped-literal separators in icon-cache write fixture

          makeWriteFixture built its synthetic cache file as
          'header-com.yueyou.cyreader-七猫小说-tail', but the probe only
          reports scoped literals and '-' is an identifier byte, so the
          bundle ID sat inside one longer identifier-like run and never
          matched. All four tests using the fixture then failed at
          'XCTAssertEqual(evidence.matches, 1)' and unwrapped a nil
          record. Use '/' separators so the bundle ID is a scoped
          literal; no production code changes."
          git push origin feature/lilashift-3.1-iphone18-2-persistence

      - name: Clean up patch file
        run: |
          git rm -q lilashift-3.1-iconcache-fix1.patch
          git commit -m "chore: remove applied icon-cache fixture patch file"
          git push origin feature/lilashift-3.1-iphone18-2-persistence
