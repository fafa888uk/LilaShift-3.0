name: Apply LilaShift 5.0 Merge Fix 3

# One-shot: apply lilashift-5.0-merge-fix3.patch (merge fix3: catalog
# counts, presets snapshot re-record, SHA-256 dedup) to the 5.0 branch.
# The patch file must already be uploaded to the branch root.
# Patch SHA-256: 95e2ec743d7dc5740284a721301ba7ee1e57ccd9e799d9d441f042ee32a46e03 (verified)
# Base: feature/lilashift-5.0 @ c07fe1b4
#   ("LilaShift 5.0.0 merge fix2: missing Combine import for UnifiedOperationLog").
# Dispatch with ref = feature/lilashift-5.0.
#
# This file must exist identically on main (so it can be dispatched)
# and on feature/lilashift-5.0 (so the run checks out the branch
# with the patch file). It stays on main afterwards as scaffolding.
#
# TEMPLATE SOURCE (authoritative): the fix1 apply workflow as it
# exists on main @ e707691, copied verbatim except for the
# parameters below (patch name, SHA-256, base, expected tree, file
# count / statistics, commit message). That template includes the
# fetch-depth: 0 fix.
#
# PLACEHOLDERS -- all filled in after the fix landed locally
# (2026-11-29):
#   SHA-256 95e2ec743d7dc5740284a721301ba7ee1e57ccd9e799d9d441f042ee32a46e03
#   3 files, +8/-8, expected tree 85bc9547d647f4b7548c9dc82cf4a1f69eccad1b
#   (local merge-fix3 commit 95ee3a0, verified by clean-checkout apply test)
#   Commit message "LilaShift 5.0.0 merge fix3: catalog counts, snapshot, SHA-256"
#   confirmed by the coordinator.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/lilashift-5.0
          fetch-depth: 0

      - name: Verify baseline is an ancestor
        run: |
          git merge-base --is-ancestor c07fe1b43c75afaa07906be754e71ee476b7ba45 HEAD
          echo "base c07fe1b4 is an ancestor of HEAD"

      - name: Verify patch file
        run: |
          ls -l lilashift-5.0-merge-fix3.patch
          echo "95e2ec743d7dc5740284a721301ba7ee1e57ccd9e799d9d441f042ee32a46e03  lilashift-5.0-merge-fix3.patch" | sha256sum -c -

      - name: Apply patch
        run: |
          git config user.name "fafa888uk"
          git config user.email "fafa888uk@users.noreply.github.com"
          git apply --index lilashift-5.0-merge-fix3.patch

      - name: Verify staged files
        run: |
          echo "=== staged files ==="
          git diff --cached --name-only
          echo "=== staged stat ==="
          git diff --cached --stat
          # Expect exactly 3 files, +8/-8 (the deleted PNG is binary
          # and contributes nothing to the numstat sums)
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --cached --name-only | grep -qxF "GestaltX/LocalPlistWorkspace.swift"
          git diff --cached --name-only | grep -qxF "tests/FeatureCatalogTests.swift"
          git diff --cached --name-only | grep -qxF "tests/__Snapshots__/DashboardV3SnapshotTests/testV3PresetsDestinationSnapshot.v3-presets-populated.png"
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print s}')" -eq 8
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print d}')" -eq 8
          # The branch also tracks the uploaded patch file and this
          # workflow file, so the staged tree includes them and can
          # never equal the expected tree. Remove them from the index
          # (disk copies stay) before comparing the tree.
          git rm --cached -q lilashift-5.0-merge-fix3.patch .github/workflows/apply-lilashift-5.0-merge-fix3.yml
          # Expect tree 85bc9547d647f4b7548c9dc82cf4a1f69eccad1b
          # (base c07fe1b4 + patch)
          test "$(git write-tree)" = "85bc9547d647f4b7548c9dc82cf4a1f69eccad1b"

      - name: Commit and push
        run: |
          git commit -m "LilaShift 5.0.0 merge fix3: catalog counts, snapshot, SHA-256"
          git push origin feature/lilashift-5.0

      - name: Clean up patch file
        if: always()
        # The patch file was already removed from the index by the
        # verify step, so it is not in the fix commit; it is only an
        # untracked file on disk in this ephemeral runner. Delete it
        # from disk; there is nothing to commit.
        run: |
          rm -f lilashift-5.0-merge-fix3.patch
          git status --porcelain
