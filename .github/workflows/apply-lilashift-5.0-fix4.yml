name: Apply LilaShift 5.0 Fix 4

# One-shot: apply lilashift-5.0-fix4.patch (fix4: optional statistics unwrap on the
# fix3 baseline) to the 5.0 branch.
# The patch file must already be uploaded to the branch root.
# Patch SHA-256: 850065da7247f3b0390390ef0538344c051b9135702c15ca57d33f5e73e2ef6f (verified)
# Base: feature/lilashift-5.0 @ 15b3137
#   ("LilaShift 5.0.0 fix3: immutable let init", tree eb2b0e94).
# Dispatch with ref = feature/lilashift-5.0.
#
# This file must exist identically on main (so it can be dispatched)
# and on feature/lilashift-5.0 (so the run checks out the branch
# with the patch file). It stays on main afterwards as scaffolding.
#
# TEMPLATE SOURCE (authoritative): the fix1 workflow as it exists
# on main @ e707691, which includes the fetch-depth: 0 fix and ran
# green. Only the parameters below were changed for fix4.
#
# PLACEHOLDERS -- all filled in after fix4 landed (2026-11-28):
#   SHA-256 850065da7247f3b0390390ef0538344c051b9135702c15ca57d33f5e73e2ef6f
#   1 file, +6/-6, expected tree 167803dec2a61289f49304ab3f32bf9c8824c638
#   (local fix4 commit 3ec48a6, verified by clean-checkout apply test)
#   Commit message "LilaShift 5.0.0 fix4: optional statistics unwrap" confirmed by the coordinator.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/lilashift-5.0
          fetch-depth: 0

      - name: Verify baseline is an ancestor
        run: |
          git merge-base --is-ancestor 15b3137cd5a02e2797a5aa0f0d737403598ba0f9 HEAD
          echo "base 15b3137 is an ancestor of HEAD"

      - name: Verify patch file
        run: |
          ls -l lilashift-5.0-fix4.patch
          echo "850065da7247f3b0390390ef0538344c051b9135702c15ca57d33f5e73e2ef6f  lilashift-5.0-fix4.patch" | sha256sum -c -

      - name: Apply patch
        run: |
          git config user.name "fafa888uk"
          git config user.email "fafa888uk@users.noreply.github.com"
          git apply --index lilashift-5.0-fix4.patch

      - name: Verify staged files
        run: |
          echo "=== staged files ==="
          git diff --cached --name-only
          echo "=== staged stat ==="
          git diff --cached --stat
          # Expect exactly 1 file, +6/-6
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git diff --cached --name-only | grep -qxF "tests/W5NetworkProbeTests.swift"
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print s}')" -eq 6
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print d}')" -eq 6
          # The branch also tracks the uploaded patch file and this
          # workflow file, so the staged tree includes them and can
          # never equal the expected tree. Remove them from the index
          # (disk copies stay) before comparing the tree.
          git rm --cached -q lilashift-5.0-fix4.patch .github/workflows/apply-lilashift-5.0-fix4.yml
          # Expect tree 167803dec2a61289f49304ab3f32bf9c8824c638
          # (base 15b3137 + patch)
          test "$(git write-tree)" = "167803dec2a61289f49304ab3f32bf9c8824c638"

      - name: Commit and push
        run: |
          git commit -m "LilaShift 5.0.0 fix4: optional statistics unwrap"
          git push origin feature/lilashift-5.0

      - name: Clean up patch file
        if: always()
        # The patch file was already removed from the index by the
        # verify step, so it is not in the fix commit; it is only an
        # untracked file on disk in this ephemeral runner. Delete it
        # from disk; there is nothing to commit.
        run: |
          rm -f lilashift-5.0-fix4.patch
          git status --porcelain
