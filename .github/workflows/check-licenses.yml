# License compliance check
#
# Runs scripts/check-licenses.py on every push that can build an IPA
# (main, the 3.0 branch, version tags), every PR to main, and every
# published release, so a broken attribution, a missing license text,
# a stale repository URL, or a version/changelog mismatch blocks the
# build before an IPA is published.
#
# DELIVERY NOTE: this file must be created through the GitHub web editor
# (or another path that writes workflow files directly). A patch that
# contains .github/workflows/* changes can never be pushed by an apply
# workflow, so this file is intentionally NOT part of the audit patch.
# Target path in the repository: .github/workflows/check-licenses.yml
name: Check Licenses

on:
  release:
    types: [published]
  push:
    branches: [main, feature/lilashift-3.0-dashboard, feature/lila-siri-ai-mode, feature/lilashift-4.0-quality-upgrade]
    tags:
      - "v*"
  pull_request:
    branches: [main, feature/lila-siri-ai-mode, feature/lilashift-4.0-quality-upgrade]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Run license compliance check
        run: python3 scripts/check-licenses.py

      - name: Run license consistency tests
        run: python3 -X utf8 tests/ThirdPartyNoticesTests.py
