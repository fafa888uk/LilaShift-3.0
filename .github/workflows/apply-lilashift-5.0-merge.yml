name: Apply LilaShift 5.0 Merge

# One-shot: apply lilashift-5.0-merge.patch (merge: the full 4.2.0
# feature set plus the official-API tools into one IPA, build
# 50000002) to the 5.0 branch.
# The patch file must already be uploaded to the branch root.
# Patch SHA-256: f2e617e2eab273d3a4b5a3e9f70c3c25f91149b73bf4a6eaec91c10ec7ac24fe (verified)
# Base: feature/lilashift-5.0 @ 80ccb27
#   ("LilaShift 5.0.0 fix6: flaky waitForIdle deadline",
#   tree 93f8793cb76fac1627e08ac746223d4fa3b35f57).
# Dispatch with ref = feature/lilashift-5.0.
#
# This file must exist identically on main (so it can be dispatched)
# and on feature/lilashift-5.0 (so the run checks out the branch
# with the patch file). It stays on main afterwards as scaffolding.
#
# TEMPLATE SOURCE (authoritative): the fix1 apply workflow as it
# exists on main @ e707691, copied verbatim except for the
# parameters below (patch name, SHA-256, base, expected tree, file
# count / statistics, commit message). That template includes the
# fetch-depth: 0 fix.
#
# PLACEHOLDERS -- all filled in after the merge landed locally
# (2026-11-28):
#   SHA-256 f2e617e2eab273d3a4b5a3e9f70c3c25f91149b73bf4a6eaec91c10ec7ac24fe
#   54 files, +3611/-54, expected tree cfea818fce049e3e9773e75f6cbf0021b2c62532
#   (local merge commit 12b3190, verified by clean-checkout apply test)
#   Commit message "LilaShift 5.0.0 merge: 4.2.0 + official API into one IPA"
#   confirmed by the coordinator.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/lilashift-5.0
          fetch-depth: 0

      - name: Verify baseline is an ancestor
        run: |
          git merge-base --is-ancestor 80ccb273cabbe2392e666e12d4a22b1e1915a808 HEAD
          echo "base 80ccb27 is an ancestor of HEAD"

      - name: Verify patch file
        run: |
          ls -l lilashift-5.0-merge.patch
          echo "f2e617e2eab273d3a4b5a3e9f70c3c25f91149b73bf4a6eaec91c10ec7ac24fe  lilashift-5.0-merge.patch" | sha256sum -c -

      - name: Apply patch
        run: |
          git config user.name "fafa888uk"
          git config user.email "fafa888uk@users.noreply.github.com"
          git apply --index lilashift-5.0-merge.patch

      - name: Verify staged files
        run: |
          echo "=== staged files ==="
          git diff --cached --name-only
          echo "=== staged stat ==="
          git diff --cached --stat
          # Expect exactly 54 files, +3611/-54
          test "$(git diff --cached --name-only | wc -l)" -eq 54
          git diff --cached --name-only | grep -qxF "CHANGELOG.md"
          git diff --cached --name-only | grep -qxF "CHANGELOG_ZH-CN.md"
          git diff --cached --name-only | grep -qxF "GestaltX.xcodeproj/project.pbxproj"
          git diff --cached --name-only | grep -qxF "GestaltX/BrightnessWriteView.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/ContentView.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/DashboardV3.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/FeatureCatalog.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/GestaltXApp.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/LocalPlistWorkspace.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/LocalPlistWorkspaceView.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/Localizable.xcstrings"
          git diff --cached --name-only | grep -qxF "GestaltX/NetworkCheckView.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/OfficialToolsPage.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/UnifiedOperationLogView.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/VerifiedChange.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/W11Appearance.xcstrings"
          git diff --cached --name-only | grep -qxF "GestaltX/W11AppearanceMode.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/W7IntelligenceReport.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/W7IntelligenceReportView.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/W7Report.xcstrings"
          git diff --cached --name-only | grep -qxF "GestaltX/W8Monitoring.xcstrings"
          git diff --cached --name-only | grep -qxF "GestaltX/W8ResourceMetrics.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/W8ResourceMonitorView.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/W9Studio.xcstrings"
          git diff --cached --name-only | grep -qxF "GestaltX/W9WallpaperStudio.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/W9WallpaperStudioView.swift"
          git diff --cached --name-only | grep -qxF "GestaltX/en.lproj/Localizable.strings"
          git diff --cached --name-only | grep -qxF "GestaltX/zh-Hans.lproj/Localizable.strings"
          git diff --cached --name-only | grep -qxF "README.md"
          git diff --cached --name-only | grep -qxF "README_JA.md"
          git diff --cached --name-only | grep -qxF "README_ZH-CN.md"
          git diff --cached --name-only | grep -qxF "SECURITY.md"
          git diff --cached --name-only | grep -qxF "docs/RELEASE_5_0_0.md"
          git diff --cached --name-only | grep -qxF "docs/REPOSITORY_GOVERNANCE_ZH-CN.md"
          git diff --cached --name-only | grep -qxF "localization/es.json"
          git diff --cached --name-only | grep -qxF "localization/fa.json"
          git diff --cached --name-only | grep -qxF "localization/ja.json"
          git diff --cached --name-only | grep -qxF "localization/ko.json"
          git diff --cached --name-only | grep -qxF "localization/ru.json"
          git diff --cached --name-only | grep -qxF "localization/vi.json"
          git diff --cached --name-only | grep -qxF "localization/zh-Hant-HK.json"
          git diff --cached --name-only | grep -qxF "localization/zh-Hant-TW.json"
          git diff --cached --name-only | grep -qxF "scripts/generate_localization.py"
          git diff --cached --name-only | grep -qxF "tests/DashboardV3NavigationTests.swift"
          git diff --cached --name-only | grep -qxF "tests/DashboardV3Tests.swift"
          git diff --cached --name-only | grep -qxF "tests/FeatureCatalogTests.swift"
          git diff --cached --name-only | grep -qxF "tests/LocalPlistWorkspaceTests.swift"
          git diff --cached --name-only | grep -qxF "tests/PrepareReleaseTests.py"
          git diff --cached --name-only | grep -qxF "tests/VerifiedChangeTests.swift"
          git diff --cached --name-only | grep -qxF "tests/W11AppearanceModeTests.swift"
          git diff --cached --name-only | grep -qxF "tests/W7IntelligenceReportTests.swift"
          git diff --cached --name-only | grep -qxF "tests/W8ResourceMetricsTests.swift"
          git diff --cached --name-only | grep -qxF "tests/W9WallpaperStudioTests.swift"
          git diff --cached --name-only | grep -qxF "tests/WiringTests.swift"
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print s}')" -eq 3611
          test "$(git diff --cached --numstat | awk '{s+=$1; d+=$2} END {print d}')" -eq 54
          # The branch also tracks the uploaded patch file and this
          # workflow file, so the staged tree includes them and can
          # never equal the expected tree. Remove them from the index
          # (disk copies stay) before comparing the tree.
          git rm --cached -q lilashift-5.0-merge.patch .github/workflows/apply-lilashift-5.0-merge.yml
          # Expect tree cfea818fce049e3e9773e75f6cbf0021b2c62532
          # (base 80ccb27 + patch)
          test "$(git write-tree)" = "cfea818fce049e3e9773e75f6cbf0021b2c62532"

      - name: Commit and push
        run: |
          git commit -m "LilaShift 5.0.0 merge: 4.2.0 + official API into one IPA"
          git push origin feature/lilashift-5.0

      - name: Clean up patch file
        if: always()
        # The patch file was already removed from the index by the
        # verify step, so it is not in the merge commit; it is only an
        # untracked file on disk in this ephemeral runner. Delete it
        # from disk; there is nothing to commit.
        run: |
          rm -f lilashift-5.0-merge.patch
          git status --porcelain
