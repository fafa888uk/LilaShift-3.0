name: Apply Stage 9-fix2 Patch

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Target branch'
        required: true
        default: 'feature/lilashift-4.0-quality-upgrade'
      patch:
        description: 'Patch file name in branch root'
        required: true
        default: 'stage9-fix2.patch'
      base_sha:
        description: 'Expected base commit SHA on target branch (must be an ancestor of HEAD)'
        required: true
        default: 'f345bed5e219b612973baf6c3f4250b8c2842a0e'
      expected_tree:
        description: 'Expected tree hash after applying patch (excluding scaffolding)'
        required: true
        default: '687318b7ad32adc0a1c6c5226b6950c7d91e51b8'
      commit_message:
        description: 'Commit message'
        required: true
        default: 'Stage 9 fix2'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Verify base commit
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          echo "base=${{ inputs.base_sha }}"
          git merge-base --is-ancestor "${{ inputs.base_sha }}" HEAD

      - name: Apply patch
        run: |
          git config user.name "Muse"
          git config user.email "muse@fafa888.uk"
          git apply --check "${{ inputs.patch }}"
          git apply "${{ inputs.patch }}"

      - name: Verify staged files
        run: |
          git add -A
          echo "staged file count:"
          git diff --cached --name-only | wc -l
          test "$(git diff --cached --name-only | wc -l)" = "5"
          echo "staged stats:"
          git diff --cached --shortstat
          test "$(git diff --cached --shortstat | sed -e 's/^ *//' -e 's/  */ /g')" = "5 files changed, 17 insertions(+), 9 deletions(-)"
          echo "scaffolding must not be staged:"
          if git diff --cached --name-only | grep -qxF "${{ inputs.patch }}"; then
            echo "ERROR: patch file is staged"
            exit 1
          fi
          if git diff --cached --name-only | grep -qxF ".github/workflows/apply-stage9-fix2.yml"; then
            echo "ERROR: apply workflow is staged"
            exit 1
          fi
          echo "deleted files (must be none):"
          git diff --cached --diff-filter=D --name-only
          test -z "$(git diff --cached --diff-filter=D --name-only)"

      - name: Verify tree hash
        run: |
          git rm --cached -q "${{ inputs.patch }}" .github/workflows/apply-stage9-fix2.yml
          TREE=$(git write-tree)
          echo "tree=$TREE"
          echo "expected=${{ inputs.expected_tree }}"
          test "$TREE" = "${{ inputs.expected_tree }}"

      - name: Commit and push
        run: |
          git commit -m "${{ inputs.commit_message }}"
          git push origin "${{ inputs.ref }}"

      - name: Cleanup scaffolding
        run: |
          rm -f "${{ inputs.patch }}"
          if git show HEAD:"${{ inputs.patch }}" >/dev/null 2>&1; then
            echo "ERROR: patch file still present in commit"
            exit 1
          fi
          if git show HEAD:.github/workflows/apply-stage9-fix2.yml >/dev/null 2>&1; then
            echo "ERROR: apply workflow still present in commit"
            exit 1
          fi
          echo "scaffolding absent from commit"
