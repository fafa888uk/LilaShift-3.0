# Apply the 3.0 docs + cleanup patch (one-shot)
#
# Manually dispatched once, on feature/lilashift-3.0-dashboard:
# applies lilashift-3.0-combined.patch (the README/CHANGELOG/docs
# rewrite + cleanup of the stale patch and scaffolds, on top of
# the HEAD 37c4a368c73ec80654c8b395387abea9a24915f6) and commits
# the result to the current branch.
# Do NOT re-run after the patch is applied: git apply --check
# fails when the changes are already in the tree, and the run
# stops before committing.
#
# The patch is verified before applying: byte size and SHA-256
# must match the expected values, and git apply --check must
# succeed. After applying, the staged diff must be exactly
# 35 files (8 deletions, 16 modifications, 11 new files),
# with the exact file list below; otherwise the run stops
# before committing or pushing.
name: Apply 3.0 docs + cleanup patch
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Verify the combined patch
        run: |
          test "$(stat -c %s lilashift-3.0-combined.patch)" = "3819241"
          echo "b470b1a03aef44438c98104e3fbd3ab9e1dfe530c016b2d250edd8e7fb55cdfa  lilashift-3.0-combined.patch" | sha256sum -c -
          git apply --check lilashift-3.0-combined.patch

      - name: Apply the docs + cleanup patch
        run: |
          git apply lilashift-3.0-combined.patch
          git add -A
          git status --short
          git diff --cached --name-status

      - name: Verify the expected 35-file diff
        run: |
          python3 - <<'PY'
          import subprocess, sys
          out = subprocess.check_output(["git", "diff", "--cached", "--name-status"], text=True)
          actual = {}
          for line in out.strip().splitlines():
              if not line.strip():
                  continue
              status, name = line.split("\t", 1)
              actual[name] = status
          expected = {
              "COMMUNITY.md": "A",
              "CONTRIBUTING.md": "A",
              "SECURITY.md": "A",
              "docs/BACKUP_RESTORE_ZH-CN.md": "A",
              "docs/COMPATIBILITY_ZH-CN.md": "A",
              "docs/FAQ_ZH-CN.md": "A",
              "docs/FEATURES_ZH-CN.md": "A",
              "docs/INSTALL_ZH-CN.md": "A",
              "docs/RELEASE_NOTES_TEMPLATE.md": "A",
              "docs/TROUBLESHOOTING_ZH-CN.md": "A",
              "docs/USER_GUIDE_ZH-CN.md": "A",
              "CHANGELOG.md": "M",
              "CHANGELOG_ZH-CN.md": "M",
              "GestaltX/AboutView.swift": "M",
              "GestaltX/Localizable.xcstrings": "M",
              "README.md": "M",
              "README_ZH-CN.md": "M",
              "localization/es.json": "M",
              "localization/fa.json": "M",
              "localization/ja.json": "M",
              "localization/ko.json": "M",
              "localization/ru.json": "M",
              "localization/vi.json": "M",
              "localization/zh-Hant-HK.json": "M",
              "localization/zh-Hant-TW.json": "M",
              "scripts/generate_localization.py": "M",
              "tests/ViewSnapshotTests.swift": "M",
              ".github/workflows/apply-p0-delta.yml": "D",
              ".github/workflows/apply-patch.yml": "D",
              ".github/workflows/apply-test-target-delta.yml": "D",
              ".github/workflows/apply-test-target-fix-round2.yml": "D",
              ".github/workflows/apply-test-target-fix-round3.yml": "D",
              ".github/workflows/apply-test-target-fix-round4.yml": "D",
              "china-unlock-v107.patch": "D",
              "scripts/verify_respring.mjs": "D",
          }
          added = sum(1 for s in actual.values() if s == "A")
          modified = sum(1 for s in actual.values() if s == "M")
          deleted = sum(1 for s in actual.values() if s == "D")
          print(f"total={len(actual)} added={added} modified={modified} deleted={deleted}")
          if actual != expected:
              print(f"expected={sorted(expected.items())}")
              print(f"actual={sorted(actual.items())}")
              sys.exit("unexpected diff: expected exactly the 35 files listed in this workflow (11 added, 16 modified, 8 deleted)")
          if "lilashift-3.0-combined.patch" in actual or ".github/workflows/apply-3.0-docs-cleanup.yml" in actual:
              sys.exit("scaffolding files must not be part of the applied diff")
          PY

      - name: Commit the applied patch
        run: |
          git config user.name "fafa920q-hue"
          git config user.email "fafa920q-hue@users.noreply.github.com"
          find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true
          git status --short
          git commit -m "docs(3.0): README/CHANGELOG/docs rewrite + cleanup stale patch and scaffolds"
          git push
